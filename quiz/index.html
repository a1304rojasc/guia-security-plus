on con una IP externa sospechosa, cuántos bytes enviaron y cuándo, sin almacenar el contenido completo de los paquetes. ¿Qué fuente usa?","opciones":["NetFlow","Captura completa de paquetes (pcap)","SNMP traps","Antivirus"],"correcta":0,"explicacion":"NetFlow registra metadatos de flujos (origen, destino, puertos, bytes, tiempo). Un pcap guarda todo el contenido; SNMP traps son alertas de dispositivos; el antivirus no registra flujos."},{"id":"D4-023","dominio":4,"objetivo":"4.4","enunciado":"Un switch envía automáticamente una notificación al sistema de gestión cuando un puerto cae. ¿Qué mecanismo usa?","opciones":["NetFlow","SAML","SNMP trap","DKIM"],"correcta":2,"explicacion":"Un SNMP trap es una notificación enviada por el dispositivo ante un evento. NetFlow registra flujos; SAML es para SSO; DKIM firma correos."},{"id":"D4-024","dominio":4,"objetivo":"4.4","enunciado":"Un equipo quiere comprobar automáticamente que la configuración de todos sus servidores cumple una lista estándar de controles usando un formato común legible por máquina. ¿Qué estándar le ayuda?","opciones":["SNMP","NetFlow","SCAP (Security Content Automation Protocol)","OAuth"],"correcta":2,"explicacion":"SCAP estandariza la evaluación automatizada de configuraciones y vulnerabilidades. SNMP gestiona dispositivos; NetFlow registra flujos; OAuth es autorización."},{"id":"D4-025","dominio":4,"objetivo":"4.5","enunciado":"Un firewall tiene reglas que permiten HTTPS y DNS. ¿Qué ocurre con el tráfico que no coincide con ninguna regla, si sigue las buenas prácticas?","opciones":["Se permite por defecto","Se envía al honeypot","Se cifra automáticamente","Se deniega por la regla de denegación implícita (implicit deny)"],"correcta":3,"explicacion":"Las buenas prácticas terminan las ACL con un «denegar todo» implícito. Permitir por defecto sería inseguro; ni se redirige a un honeypot ni se cifra automáticamente."},{"id":"D4-026","dominio":4,"objetivo":"4.5","enunciado":"Los clientes de una empresa reciben correos falsos que parecen enviados desde su dominio. ¿Qué registro DNS indica qué servidores están autorizados a enviar correo en nombre del dominio?","opciones":["DKIM","DMARC","SPF","MX"],"correcta":2,"explicacion":"SPF lista los servidores autorizados a enviar. DKIM firma los mensajes; DMARC define la política cuando SPF/DKIM fallan e informa; MX indica dónde se recibe el correo."},{"id":"D4-027","dominio":4,"objetivo":"4.5","enunciado":"Una empresa quiere indicar a los servidores receptores que rechacen los correos que fallen SPF y DKIM y recibir informes de los intentos de suplantación. ¿Qué debe configurar?","opciones":["SPF solamente","DNSSEC","DMARC","SNMPv3"],"correcta":2,"explicacion":"DMARC define la política (none/quarantine/reject) y el envío de informes. SPF solo lista servidores; DNSSEC firma respuestas DNS; SNMPv3 gestiona dispositivos."},{"id":"D4-028","dominio":4,"objetivo":"4.5","enunciado":"Un equipo de seguridad quiere detectar cuándo se modifica cualquier archivo del directorio de binarios del sistema en sus servidores. ¿Qué herramienta es adecuada?","opciones":["Filtrado DNS","Balanceador de carga","Monitorización de integridad de archivos (FIM)","Proxy directo"],"correcta":2,"explicacion":"FIM detecta cambios en archivos críticos comparando hashes. El filtrado DNS bloquea dominios; el balanceador reparte tráfico; el proxy media la navegación."},{"id":"D4-029","dominio":4,"objetivo":"4.5","enunciado":"Una empresa quiere impedir que los empleados envíen números de tarjeta de crédito por correo o los suban a servicios en la nube no autorizados. ¿Qué solución es la más adecuada?","opciones":["DLP (Data Loss Prevention)","IDS basado en firmas","NAC","Proxy inverso"],"correcta":0,"explicacion":"DLP inspecciona contenido y bloquea la salida de datos sensibles. Un IDS detecta ataques; NAC controla qué dispositivos entran en la red; un proxy inverso protege servidores."},{"id":"D4-030","dominio":4,"objetivo":"4.5","enunciado":"El equipo de red debe reemplazar Telnet para administrar los switches. ¿Qué protocolo y puerto debe usar?","opciones":["HTTP, puerto 80","SSH, puerto 22","FTP, puerto 21","SNMPv1, puerto 161"],"correcta":1,"explicacion":"SSH (22) cifra la sesión de administración remota. HTTP, FTP y SNMPv1 transmiten datos en claro."},{"id":"D4-031","dominio":4,"objetivo":"4.5","enunciado":"Antes de permitir que un portátil se conecte a la red, el sistema comprueba que tiene el antivirus actualizado y los parches instalados; si no, lo envía a una VLAN de remediación. ¿Qué tecnología es?","opciones":["DLP","SIEM","WAF","NAC (Network Access Control)"],"correcta":3,"explicacion":"NAC evalúa el estado (posture) del dispositivo antes de darle acceso. DLP evita fugas de datos; SIEM correlaciona logs; WAF protege aplicaciones web."},{"id":"D4-032","dominio":4,"objetivo":"4.5","enunciado":"El equipo quiere detectar a un empleado que empieza a descargar volúmenes de datos muy superiores a su patrón habitual a las 3 de la madrugada. ¿Qué tecnología es más adecuada?","opciones":["Analítica de comportamiento de usuarios y entidades (UEBA)","Antivirus basado en firmas","Filtrado DNS","SPF"],"correcta":0,"explicacion":"UEBA establece una línea base de comportamiento y detecta desviaciones. Un antivirus por firmas no ve comportamientos; el filtrado DNS bloquea dominios; SPF es para correo."},{"id":"D4-033","dominio":4,"objetivo":"4.6","enunciado":"Un empleado deja la empresa el viernes. El lunes, su cuenta sigue activa y se usa para acceder a archivos. ¿Qué proceso falló?","opciones":["Federación","Atestación de hardware","Single sign-on","Desaprovisionamiento (deprovisioning) de cuentas"],"correcta":3,"explicacion":"Al salir un empleado se deben deshabilitar sus cuentas (deprovisioning). La federación, la atestación de hardware o el SSO no gestionan la baja de usuarios."},{"id":"D4-034","dominio":4,"objetivo":"4.6","enunciado":"Los empleados inician sesión una vez en el portal corporativo y acceden sin volver a autenticarse a varias aplicaciones SaaS mediante aserciones XML firmadas. ¿Qué tecnología se usa?","opciones":["SAML para SSO federado","LDAP sin cifrar","RADIUS","Kerberos con NTLM"],"correcta":0,"explicacion":"SAML intercambia aserciones XML entre el proveedor de identidad y los proveedores de servicio para SSO web. LDAP es un directorio; RADIUS es AAA de red; NTLM es un protocolo heredado de Windows."},{"id":"D4-035","dominio":4,"objetivo":"4.6","enunciado":"Una app de terceros solicita permiso para leer tu calendario de Google sin conocer tu contraseña. ¿Qué protocolo permite esta autorización delegada?","opciones":["SAML","LDAP","TACACS+","OAuth"],"correcta":3,"explicacion":"OAuth permite delegar acceso limitado a recursos sin compartir credenciales. SAML es principalmente SSO empresarial; LDAP es un directorio; TACACS+ es AAA para dispositivos de red."},{"id":"D4-036","dominio":4,"objetivo":"4.6","enunciado":"En un sistema militar, cada documento tiene una etiqueta (Confidencial, Secreto, Alto secreto) y los usuarios una habilitación; ni siquiera el creador puede cambiar quién accede. ¿Qué modelo es?","opciones":["Control de acceso obligatorio (MAC)","Control de acceso discrecional (DAC)","Control basado en roles (RBAC)","Control basado en reglas"],"correcta":0,"explicacion":"En MAC el sistema decide según etiquetas y habilitaciones, no el propietario. En DAC decide el propietario; RBAC usa roles de puesto; el basado en reglas aplica reglas globales como horarios."},{"id":"D4-037","dominio":4,"objetivo":"4.6","enunciado":"El sistema de historias clínicas permite a un médico acceder solo a pacientes de su planta, durante su turno y desde equipos del hospital. ¿Qué modelo de control de acceso combina estos criterios?","opciones":["Control basado en atributos (ABAC)","Control discrecional (DAC)","Control obligatorio (MAC)","Control basado en roles puro (RBAC)"],"correcta":0,"explicacion":"ABAC combina atributos del usuario (planta), del recurso (paciente) y del entorno (horario, equipo). DAC depende del propietario; MAC de etiquetas; RBAC solo del rol."},{"id":"D4-038","dominio":4,"objetivo":"4.6","enunciado":"Al crear un archivo en un servidor Windows, su propietario decide a qué compañeros da permiso de lectura o escritura. ¿Qué modelo es?","opciones":["Control de acceso discrecional (DAC)","Control de acceso obligatorio (MAC)","Control basado en atributos (ABAC)","Control basado en reglas"],"correcta":0,"explicacion":"En DAC el propietario del recurso decide los permisos. MAC usa etiquetas impuestas por el sistema; ABAC evalúa atributos; el basado en reglas aplica reglas globales."},{"id":"D4-039","dominio":4,"objetivo":"4.6","enunciado":"Un sistema de acceso pide contraseña y un PIN de 6 dígitos memorizado. ¿Cuántos factores de autenticación distintos se usan?","opciones":["Dos, porque son dos credenciales distintas","Tres, contando el nombre de usuario","Uno, porque ambos son «algo que sabes»","Ninguno, porque el PIN no es un factor"],"correcta":2,"explicacion":"Contraseña y PIN pertenecen al mismo factor (conocimiento). Para MFA hacen falta factores de categorías distintas, como contraseña + token. El nombre de usuario es identificación, no un factor."},{"id":"D4-040","dominio":4,"objetivo":"4.6","enunciado":"Los administradores no tienen privilegios permanentes; solicitan acceso de administrador para una tarea, se aprueba durante 2 horas y luego se revoca automáticamente. ¿Qué técnica de PAM es?","opciones":["Federación","Acceso justo a tiempo (just-in-time)","Contraseñas sin caducidad","Control discrecional"],"correcta":1,"explicacion":"JIT concede privilegios solo cuando se necesitan y por tiempo limitado. La federación comparte identidades entre organizaciones; las contraseñas sin caducidad son una mala práctica; DAC es un modelo de acceso."},{"id":"D4-041","dominio":4,"objetivo":"4.6","enunciado":"Las contraseñas de las cuentas de servicio y de administración se guardan en una bóveda que las rota automáticamente y registra quién las usa. ¿Qué técnica es?","opciones":["Hoja de cálculo compartida cifrada","Inicio de sesión único (SSO)","Bóveda de contraseñas (password vaulting) de una solución PAM","Clonación RFID"],"correcta":2,"explicacion":"El password vaulting de PAM almacena, rota y audita credenciales privilegiadas. Una hoja de cálculo no rota ni audita; SSO es para usuarios finales; la clonación RFID es un ataque."},{"id":"D4-042","dominio":4,"objetivo":"4.7","enunciado":"Un equipo de seguridad configura un sistema que, cuando el SIEM detecta phishing, extrae automáticamente los indicadores, bloquea el remitente, busca el correo en todos los buzones y abre un ticket. ¿Qué tecnología usa?","opciones":["DLP","SOAR con playbooks automatizados","UPS","NetFlow"],"correcta":1,"explicacion":"SOAR orquesta y automatiza respuestas mediante playbooks. DLP evita fugas; un UPS da energía; NetFlow registra flujos."},{"id":"D4-043","dominio":4,"objetivo":"4.7","enunciado":"¿Cuál es un riesgo de depender mucho de scripts de automatización para tareas de seguridad?","opciones":["Que reduzcan el tiempo de respuesta","Que apliquen las líneas base de forma consistente","Que liberen tiempo del personal","Que se conviertan en un punto único de fallo y generen deuda técnica si no se mantienen"],"correcta":3,"explicacion":"La automatización puede crear complejidad, puntos únicos de fallo y deuda técnica. Las demás opciones son beneficios de la automatización, no riesgos."},{"id":"D4-044","dominio":4,"objetivo":"4.7","enunciado":"Al crear un empleado en el sistema de RR. HH., se crean automáticamente su cuenta, sus grupos de acceso según el puesto y su buzón de correo. ¿Qué caso de uso de automatización es?","opciones":["Análisis forense","Aprovisionamiento de usuarios (user provisioning)","Retención legal","Ejercicio de mesa"],"correcta":1,"explicacion":"Crear cuentas y permisos automáticamente es aprovisionamiento de usuarios. El análisis forense, la retención legal y los ejercicios de mesa no tratan de crear cuentas."},{"id":"D4-045","dominio":4,"objetivo":"4.8","enunciado":"Un analista confirma que un servidor web está comprometido. ¿Cuál es el siguiente paso según el proceso de respuesta a incidentes?","opciones":["Lecciones aprendidas (lessons learned)","Contención (containment)","Recuperación (recovery)","Preparación (preparation)"],"correcta":1,"explicacion":"Tras la detección y el análisis viene la contención para limitar el daño. Las lecciones aprendidas van al final; la recuperación después de la erradicación; la preparación es previa al incidente."},{"id":"D4-046","dominio":4,"objetivo":"4.8","enunciado":"Tras eliminar el malware y restaurar los sistemas, el equipo se reúne para documentar qué funcionó, qué falló y qué cambiar. ¿Qué fase es?","opciones":["Detección","Contención","Lecciones aprendidas (lessons learned)","Erradicación"],"correcta":2,"explicacion":"La revisión post-incidente para mejorar es la fase de lecciones aprendidas. Detección, contención y erradicación son fases anteriores de gestión del incidente."},{"id":"D4-047","dominio":4,"objetivo":"4.8","enunciado":"Un investigador forense debe recoger evidencias de un equipo encendido. ¿Qué debe capturar primero según el orden de volatilidad?","opciones":["El disco duro","Las copias de seguridad en cinta","La memoria RAM","Los logs almacenados en un servidor remoto"],"correcta":2,"explicacion":"La RAM es más volátil que el disco, los logs remotos o las copias en cinta y se pierde al apagar. Por eso se captura primero."},{"id":"D4-048","dominio":4,"objetivo":"4.8","enunciado":"Un disco con evidencias pasó por las manos de tres técnicos, pero no se registró quién lo tuvo entre el martes y el jueves. ¿Qué consecuencia es más probable en un juicio?","opciones":["La evidencia se vuelve más fiable","La evidencia puede ser inadmisible por romperse la cadena de custodia","No tiene ninguna consecuencia si el disco está cifrado","Se aplica automáticamente una retención legal"],"correcta":1,"explicacion":"Sin un registro completo de la cadena de custodia no se puede demostrar que la evidencia no se alteró. El cifrado no lo soluciona y la retención legal es otro concepto (obligación de conservar)."},{"id":"D4-049","dominio":4,"objetivo":"4.8","enunciado":"El departamento legal notifica que la empresa ha sido demandada y que no se puede borrar ningún correo relacionado con un proyecto, aunque la política de retención lo indique. ¿Qué es?","opciones":["Cadena de custodia","Retención legal (legal hold)","Lecciones aprendidas","Threat hunting"],"correcta":1,"explicacion":"La retención legal obliga a conservar datos relevantes para un litigio, por encima de la política de retención. La cadena de custodia registra el manejo de evidencias; las otras opciones no tienen relación."},{"id":"D4-050","dominio":4,"objetivo":"4.8","enunciado":"Sin ninguna alerta previa, un analista revisa proactivamente los logs buscando señales de técnicas de un grupo APT recién publicado. ¿Qué actividad realiza?","opciones":["Contención","Búsqueda de amenazas (threat hunting)","Ejercicio de mesa","Gestión de cambios"],"correcta":1,"explicacion":"Buscar proactivamente amenazas no detectadas es threat hunting. La contención responde a un incidente confirmado; el tabletop es un ejercicio de discusión; la gestión de cambios controla modificaciones."},{"id":"D4-051","dominio":4,"objetivo":"4.8","enunciado":"Tras adquirir una imagen bit a bit del disco de un sospechoso, ¿qué hace el analista para demostrar que la copia es idéntica al original?","opciones":["Calcula y compara el hash de ambos","Comprime la imagen con ZIP","Cifra la copia con la clave pública del juez","Formatea el disco original"],"correcta":0,"explicacion":"Comparar hashes demuestra que la copia es exacta. Comprimir o cifrar no prueba identidad, y formatear el original destruye la evidencia."},{"id":"D4-052","dominio":4,"objetivo":"4.9","enunciado":"Un analista sospecha que un correo de phishing fue enviado a través de un servidor concreto. ¿Qué fuente revisa primero para ver la ruta del mensaje?","opciones":["Los logs del SAI","El escaneo de vulnerabilidades del mes pasado","El certificado TLS del sitio web corporativo","Las cabeceras del correo (metadatos)"],"correcta":3,"explicacion":"Las cabeceras «Received» muestran los servidores por los que pasó el correo: son metadatos. Los logs del SAI, el escaneo antiguo o el certificado del sitio no muestran esa ruta."},{"id":"D4-053","dominio":4,"objetivo":"4.9","enunciado":"Durante una investigación se necesita reconstruir exactamente qué comandos envió un atacante por una sesión HTTP no cifrada. ¿Qué fuente de datos lo permite?","opciones":["NetFlow","Logs de SNMP","Dashboard de disponibilidad","Captura de paquetes (packet capture)"],"correcta":3,"explicacion":"La captura de paquetes guarda el contenido completo del tráfico. NetFlow solo guarda metadatos; SNMP y los dashboards no registran el contenido de las sesiones."},{"id":"D4-054","dominio":4,"objetivo":"4.9","enunciado":"Un analista quiere saber si una conexión saliente hacia una IP maliciosa fue permitida o bloqueada en el perímetro. ¿Qué log consulta?","opciones":["Logs de la aplicación de nóminas","Logs del SAI","Metadatos EXIF de una imagen","Logs del firewall"],"correcta":3,"explicacion":"El firewall registra conexiones permitidas o denegadas por IP y puerto. La aplicación de nóminas, el SAI o el EXIF no registran el tráfico perimetral."},{"id":"D4-055","dominio":4,"objetivo":"4.9","enunciado":"Se investiga una fuga y se quiere conocer qué usuario inició sesión en un servidor Windows y a qué hora. ¿Qué fuente es la más directa?","opciones":["Logs de seguridad del sistema operativo (eventos de inicio de sesión)","Logs del IPS","Escaneo de vulnerabilidades","NetFlow"],"correcta":0,"explicacion":"Los eventos de inicio de sesión del SO registran usuario y hora. El IPS registra firmas de ataque; el escaneo muestra vulnerabilidades; NetFlow registra flujos de red, no usuarios."},{"id":"D4-056","dominio":4,"objetivo":"4.9","enunciado":"Un analista quiere saber qué vulnerabilidades tenía un servidor antes de ser comprometido para determinar el vector probable. ¿Qué fuente consulta?","opciones":["Los logs del SAI","Los informes de escaneos de vulnerabilidades previos","La política de uso aceptable","La lista de revocación de certificados"],"correcta":1,"explicacion":"Los escaneos previos muestran qué estaba expuesto y ayudan a deducir el vector de entrada. Las demás fuentes no informan sobre vulnerabilidades."},{"id":"D5-001","dominio":5,"objetivo":"5.1","enunciado":"Un documento de la empresa dice: «Todas las contraseñas deben tener al menos 14 caracteres y renovarse ante cualquier sospecha de compromiso». ¿Qué tipo de documento de gobernanza es?","opciones":["Estándar (standard)","Guía (guideline)","Política (policy)","Procedimiento (procedure)"],"correcta":0,"explicacion":"Un estándar fija requisitos concretos y obligatorios. La política es una declaración de alto nivel; la guía es una recomendación no obligatoria; el procedimiento describe pasos detallados."},{"id":"D5-002","dominio":5,"objetivo":"5.1","enunciado":"Un documento recomienda, sin obligar, usar gestores de contraseñas y frases largas fáciles de recordar. ¿Qué tipo de documento es?","opciones":["Guía (guideline)","Estándar (standard)","Política (policy)","Procedimiento (procedure)"],"correcta":0,"explicacion":"Las guías son recomendaciones no obligatorias. Estándares, políticas y procedimientos son de obligado cumplimiento."},{"id":"D5-003","dominio":5,"objetivo":"5.1","enunciado":"Un documento explica paso a paso cómo dar de baja a un empleado: deshabilitar la cuenta, recoger el portátil, revocar tarjetas y transferir archivos. ¿Qué es?","opciones":["Procedimiento (procedure) de salida (offboarding)","Política de uso aceptable","Guía de contraseñas","Acuerdo de nivel de servicio"],"correcta":0,"explicacion":"Los pasos detallados para una tarea forman un procedimiento. La AUP regula el uso de recursos; una guía recomienda; un SLA define niveles de servicio con un proveedor."},{"id":"D5-004","dominio":5,"objetivo":"5.1","enunciado":"Los empleados firman al incorporarse un documento que establece qué pueden y qué no pueden hacer con el correo, internet y los equipos corporativos. ¿Qué documento es?","opciones":["Plan de recuperación ante desastres","Política de uso aceptable (AUP)","Acuerdo de confidencialidad con proveedores","Procedimiento de gestión de cambios"],"correcta":1,"explicacion":"La AUP define el uso permitido de los recursos y suele firmarse al incorporarse. Las demás opciones cubren recuperación, proveedores o cambios, no el uso diario de los recursos."},{"id":"D5-005","dominio":5,"objetivo":"5.1","enunciado":"Según el RGPD, una empresa decide qué datos personales de clientes recoger y con qué fin, y contrata a una empresa de nóminas para procesarlos siguiendo sus instrucciones. ¿Qué papel tiene la empresa de nóminas?","opciones":["Encargado del tratamiento (processor)","Responsable del tratamiento (controller)","Sujeto de los datos (data subject)","Propietario de los datos (data owner)"],"correcta":0,"explicacion":"El encargado trata datos por cuenta del responsable y según sus instrucciones. El responsable decide el fin y los medios; el sujeto es la persona a quien se refieren los datos; el propietario es un rol interno de la organización."},{"id":"D5-006","dominio":5,"objetivo":"5.1","enunciado":"En una organización, el administrador de bases de datos realiza las copias, aplica el cifrado y gestiona los permisos técnicos de los datos de clientes según lo que decide el director comercial. ¿Qué rol tiene el administrador?","opciones":["Propietario de datos (data owner)","Custodio de datos (data custodian)","Responsable del tratamiento (controller)","Sujeto de los datos"],"correcta":1,"explicacion":"El custodio aplica los controles técnicos; el propietario (aquí el director comercial) decide clasificación y acceso. El controller decide fines del tratamiento; el sujeto es la persona titular de los datos."},{"id":"D5-007","dominio":5,"objetivo":"5.2","enunciado":"Un servidor vale 40 000 €. Un incendio destruiría el 25 % de su valor. Se estima que ocurre un incendio cada 20 años. ¿Cuál es la ALE?","opciones":["500 €","10 000 €","2 000 €","800 €"],"correcta":0,"explicacion":"SLE = AV × EF = 40 000 × 0,25 = 10 000 €. ARO = 1/20 = 0,05. ALE = SLE × ARO = 10 000 × 0,05 = 500 €. 10 000 € es la SLE; los otros valores proceden de cálculos incorrectos."},{"id":"D5-008","dominio":5,"objetivo":"5.2","enunciado":"Una empresa contrata un seguro de ciberriesgos para cubrir posibles pérdidas por ransomware. ¿Qué estrategia de gestión del riesgo aplica?","opciones":["Mitigar (mitigate)","Evitar (avoid)","Transferir (transfer)","Aceptar (accept)"],"correcta":2,"explicacion":"El seguro transfiere el impacto económico a un tercero. Mitigar sería aplicar controles; evitar, dejar la actividad; aceptar, asumir el riesgo sin actuar."},{"id":"D5-009","dominio":5,"objetivo":"5.2","enunciado":"Una empresa decide dejar de almacenar números de tarjeta y usar un proveedor de pagos externo, eliminando así ese riesgo de sus sistemas. ¿Qué estrategia aplica?","opciones":["Aceptar (accept)","Transferir con un seguro","Ignorar el riesgo","Evitar (avoid)"],"correcta":3,"explicacion":"Dejar de realizar la actividad que genera el riesgo es evitarlo. Aceptar sería mantenerlo; transferir con seguro conservaría la actividad; ignorar no es una estrategia válida."},{"id":"D5-010","dominio":5,"objetivo":"5.2","enunciado":"Una vulnerabilidad de bajo impacto costaría 50 000 € corregirla, mientras que la pérdida anual estimada es de 300 €. La dirección decide documentarla y no hacer nada más. ¿Qué estrategia es?","opciones":["Mitigar","Transferir","Evitar","Aceptar (accept)"],"correcta":3,"explicacion":"Si el coste del control supera ampliamente el impacto, se acepta el riesgo de forma documentada. No se aplican controles (mitigar), ni seguro (transferir), ni se abandona la actividad (evitar)."},{"id":"D5-011","dominio":5,"objetivo":"5.2","enunciado":"Una tienda online determina que puede perder como máximo 15 minutos de pedidos en caso de desastre. ¿Qué métrica ha definido?","opciones":["RTO (Recovery Time Objective)","MTBF (Mean Time Between Failures)","MTTR (Mean Time To Repair)","RPO (Recovery Point Objective)"],"correcta":3,"explicacion":"El RPO define la pérdida máxima de datos aceptable, medida en tiempo, y determina la frecuencia de copias. El RTO es el tiempo para restaurar el servicio; MTBF y MTTR miden fiabilidad y reparación."},{"id":"D5-012","dominio":5,"objetivo":"5.2","enunciado":"La dirección establece que el sistema de reservas debe volver a estar operativo como máximo 2 horas después de una interrupción. ¿Qué métrica es?","opciones":["RPO (Recovery Point Objective)","ALE (Annualized Loss Expectancy)","MTBF (Mean Time Between Failures)","RTO (Recovery Time Objective)"],"correcta":3,"explicacion":"El RTO es el tiempo máximo aceptable para restaurar el servicio. El RPO trata de pérdida de datos; la ALE es pérdida económica anual; el MTBF mide fiabilidad."},{"id":"D5-013","dominio":5,"objetivo":"5.2","enunciado":"Un fabricante indica que sus discos fallan de media cada 1,2 millones de horas de funcionamiento. ¿Qué métrica es?","opciones":["MTTR (Mean Time To Repair)","MTBF (Mean Time Between Failures)","RTO","RPO"],"correcta":1,"explicacion":"El tiempo medio entre fallos (MTBF) mide la fiabilidad. El MTTR mide cuánto se tarda en reparar; RTO y RPO son objetivos de recuperación del negocio."},{"id":"D5-014","dominio":5,"objetivo":"5.2","enunciado":"Tras aplicar un firewall, MFA y formación, aún queda cierta probabilidad de que un ataque tenga éxito. ¿Cómo se llama ese riesgo?","opciones":["Riesgo inherente (inherent risk)","Apetito de riesgo (risk appetite)","Riesgo residual (residual risk)","Indicador clave de riesgo (KRI)"],"correcta":2,"explicacion":"El riesgo que queda tras aplicar controles es el residual. El inherente es el riesgo antes de los controles; el apetito es cuánto riesgo se está dispuesto a asumir; un KRI es una métrica de seguimiento."},{"id":"D5-015","dominio":5,"objetivo":"5.2","enunciado":"Una empresa mantiene un documento con cada riesgo identificado, su probabilidad, impacto, propietario y controles planificados. ¿Cómo se llama?","opciones":["Acuerdo de nivel de servicio","Política de uso aceptable","Registro de riesgos (risk register)","Cadena de custodia"],"correcta":2,"explicacion":"El registro de riesgos documenta riesgos, propietarios, valoraciones y respuestas. El SLA es un contrato de servicio; la AUP regula el uso de recursos; la cadena de custodia registra evidencias."},{"id":"D5-016","dominio":5,"objetivo":"5.2","enunciado":"Un comité clasifica los riesgos como «alto», «medio» o «bajo» en una matriz de probabilidad e impacto, sin calcular valores monetarios. ¿Qué tipo de análisis es?","opciones":["Cuantitativo (quantitative)","Análisis forense","Análisis de brechas","Cualitativo (qualitative)"],"correcta":3,"explicacion":"Usar categorías en lugar de cifras es análisis cualitativo. El cuantitativo usa valores numéricos (SLE, ALE); el forense investiga incidentes; el de brechas compara estados."},{"id":"D5-017","dominio":5,"objetivo":"5.2","enunciado":"Si el SLE de un incidente es 8 000 € y ocurre 3 veces al año, ¿cuál es la ALE?","opciones":["2 667 €","8 000 €","24 000 €","11 000 €"],"correcta":2,"explicacion":"ALE = SLE × ARO = 8 000 × 3 = 24 000 €. 2 667 € resulta de dividir en lugar de multiplicar; 8 000 € es el SLE; 11 000 € suma en lugar de multiplicar."},{"id":"D5-018","dominio":5,"objetivo":"5.3","enunciado":"Antes de firmar con un proveedor de nube, una empresa quiere incluir en el contrato su derecho a revisar los controles de seguridad del proveedor. ¿Qué cláusula necesita?","opciones":["Acuerdo de confidencialidad (NDA)","Derecho a auditar (right-to-audit)","Memorando de entendimiento (MOU)","Política de uso aceptable"],"correcta":1,"explicacion":"La cláusula de derecho a auditar permite verificar los controles del proveedor. El NDA protege información confidencial; el MOU es un acuerdo informal; la AUP es interna."},{"id":"D5-019","dominio":5,"objetivo":"5.3","enunciado":"Un contrato con un proveedor de hosting garantiza un 99,95 % de disponibilidad mensual y compensaciones si no se cumple. ¿Qué documento es?","opciones":["Acuerdo de nivel de servicio (SLA)","Acuerdo de socios de negocio (BPA)","NDA","Declaración de trabajo (SOW)"],"correcta":0,"explicacion":"El SLA define métricas de servicio medibles y penalizaciones. El BPA regula la relación entre socios; el NDA la confidencialidad; el SOW un trabajo concreto con entregables."},{"id":"D5-020","dominio":5,"objetivo":"5.3","enunciado":"Una empresa firma un contrato marco con una consultora que fija las condiciones generales; después, para cada proyecto, firma un documento con el alcance, entregables y plazos concretos. ¿Qué documentos son, en ese orden?","opciones":["SLA y NDA","MOU y BPA","NDA y MSA","MSA y SOW"],"correcta":3,"explicacion":"El MSA (Master Service Agreement) fija las condiciones generales y el SOW/WO cada trabajo concreto. SLA y NDA cubren niveles de servicio y confidencialidad; MOU y BPA son acuerdos de colaboración."},{"id":"D5-021","dominio":5,"objetivo":"5.3","enunciado":"Antes de compartir sus planes de producto con un posible proveedor durante una negociación, una empresa quiere protegerse legalmente contra la divulgación. ¿Qué debe firmar?","opciones":["SLA","Acuerdo de confidencialidad (NDA)","Acuerdo de socios de negocio (BPA)","Procedimiento de offboarding"],"correcta":1,"explicacion":"El NDA obliga a no divulgar la información confidencial. El SLA mide servicio; el BPA regula una sociedad de negocio; el offboarding es un proceso de RR. HH."},{"id":"D5-022","dominio":5,"objetivo":"5.3","enunciado":"Antes de contratar a un proveedor crítico, la empresa revisa su situación financiera, sus certificaciones, incidentes previos y posibles conflictos de interés. ¿Qué proceso es?","opciones":["Diligencia debida (due diligence) en la selección de proveedores","Retención legal","Prueba de penetración física","Análisis de causa raíz"],"correcta":0,"explicacion":"Investigar a un proveedor antes de contratarlo es diligencia debida. La retención legal conserva datos para litigios; el pentest físico prueba instalaciones; el análisis de causa raíz investiga incidentes."},{"id":"D5-023","dominio":5,"objetivo":"5.3","enunciado":"Dos empresas forman una alianza para comercializar un producto conjunto y necesitan un acuerdo que defina reparto de beneficios, responsabilidades y obligaciones de seguridad. ¿Qué documento es el más adecuado?","opciones":["Acuerdo de socios de negocio (BPA)","SLA","NDA","Política de contraseñas"],"correcta":0,"explicacion":"El BPA regula la relación entre socios, incluidos beneficios y responsabilidades. El SLA fija niveles de servicio; el NDA solo protege confidencialidad; la política de contraseñas es interna."},{"id":"D5-024","dominio":5,"objetivo":"5.3","enunciado":"Una empresa envía anualmente a sus proveedores un cuestionario sobre sus controles de seguridad y revisa sus informes de auditoría independientes. ¿Qué actividad es?","opciones":["Threat hunting","Ejercicio de mesa","Monitorización continua de proveedores (vendor monitoring)","Aprovisionamiento de usuarios"],"correcta":2,"explicacion":"Los cuestionarios y la revisión de auditorías forman parte de la monitorización de terceros. Las demás opciones son actividades técnicas internas."},{"id":"D5-025","dominio":5,"objetivo":"5.4","enunciado":"Una empresa no cumple con la normativa de protección de datos tras una fuga. ¿Qué consecuencias puede sufrir?","opciones":["Ninguna si tenía antivirus","Solo una reducción del RTO","Multas, sanciones, daño reputacional y pérdida de licencias o contratos","Un aumento automático del MTBF"],"correcta":2,"explicacion":"El incumplimiento puede acarrear multas, sanciones, daño reputacional y pérdida de licencias. Tener antivirus no exime; RTO y MTBF son métricas técnicas no relacionadas."},{"id":"D5-026","dominio":5,"objetivo":"5.4","enunciado":"Un cliente europeo solicita que una empresa elimine todos sus datos personales porque ya no desea ser cliente. ¿Qué derecho ejerce?","opciones":["Derecho a auditar","Derecho al olvido (right to be forgotten)","Soberanía de datos","Retención legal"],"correcta":1,"explicacion":"El RGPD reconoce el derecho de supresión o derecho al olvido. El derecho a auditar es contractual con proveedores; la soberanía depende de la ubicación; la retención legal obliga a conservar."},{"id":"D5-027","dominio":5,"objetivo":"5.4","enunciado":"Cada año, los empleados confirman por escrito que han leído y aceptan las políticas de seguridad vigentes. ¿Qué concepto de cumplimiento es?","opciones":["Atestación y reconocimiento (attestation and acknowledgement)","Diligencia debida con proveedores","Análisis cuantitativo","Gestión de parches"],"correcta":0,"explicacion":"Confirmar formalmente la lectura y aceptación de políticas es reconocimiento/atestación. La diligencia debida se aplica a terceros; el análisis cuantitativo y los parches son otros procesos."},{"id":"D5-028","dominio":5,"objetivo":"5.4","enunciado":"La persona cuyos datos personales trata una organización se denomina...","opciones":["Encargado del tratamiento (processor)","Custodio de datos","Sujeto de los datos (data subject)","Responsable del tratamiento (controller)"],"correcta":2,"explicacion":"El sujeto de los datos es la persona identificada o identificable. El encargado trata datos por cuenta de otro; el custodio aplica controles; el responsable decide fines y medios."},{"id":"D5-029","dominio":5,"objetivo":"5.5","enunciado":"Un auditor contratado por una empresa evalúa sus controles y emite un informe SOC 2 para que los clientes confíen en ella. ¿Qué tipo de evaluación es?","opciones":["Autoevaluación interna","Ejercicio de mesa","Bug bounty","Auditoría externa independiente"],"correcta":3,"explicacion":"Un informe SOC 2 lo emite un auditor externo independiente. La autoevaluación la hace la propia empresa; el tabletop es un ejercicio de respuesta; el bug bounty busca fallos con recompensas."},{"id":"D5-030","dominio":5,"objetivo":"5.5","enunciado":"Un pentester recibe diagramas de red, código fuente y credenciales antes de comenzar la prueba. ¿Qué tipo de entorno es?","opciones":["Entorno desconocido (unknown environment)","Entorno parcialmente conocido (partially known environment)","Reconocimiento pasivo","Entorno conocido (known environment)"],"correcta":3,"explicacion":"Con toda la información disponible es un entorno conocido (antes white box). Desconocido es sin información (black box); parcialmente conocido, con información limitada (gray box); el reconocimiento pasivo es una técnica, no un tipo de entorno."},{"id":"D5-031","dominio":5,"objetivo":"5.5","enunciado":"Un pentester solo recibe el nombre de la empresa y debe actuar como un atacante externo sin información previa. ¿Qué tipo de prueba es?","opciones":["Entorno conocido (known environment)","Entorno desconocido (unknown environment)","Entorno parcialmente conocido","Auditoría interna de cumplimiento"],"correcta":1,"explicacion":"Sin información previa es un entorno desconocido (black box). Las otras opciones implican información parcial o total, o una auditoría que no es un pentest."},{"id":"D5-032","dominio":5,"objetivo":"5.5","enunciado":"Durante un pentest, el equipo consulta LinkedIn, el registro WHOIS y las ofertas de empleo de la empresa sin enviar ningún paquete a sus sistemas. ¿Qué fase realiza?","opciones":["Reconocimiento activo (active reconnaissance)","Reconocimiento pasivo (passive reconnaissance)","Explotación","Escalada de privilegios"],"correcta":1,"explicacion":"Recopilar información de fuentes abiertas sin interactuar con el objetivo es reconocimiento pasivo. El activo incluye escaneos directos; la explotación y la escalada vienen después."},{"id":"D5-033","dominio":5,"objetivo":"5.5","enunciado":"Antes de comenzar un pentest, el cliente y el equipo de pruebas acuerdan el alcance, las IPs permitidas, el horario y los contactos de emergencia. ¿Qué documento es?","opciones":["Acuerdo de nivel de servicio","Política de uso aceptable","Reglas de compromiso (rules of engagement)","Registro de riesgos"],"correcta":2,"explicacion":"Las reglas de compromiso delimitan qué, cuándo y cómo se puede probar. El SLA mide un servicio; la AUP regula a los empleados; el registro de riesgos documenta riesgos."},{"id":"D5-034","dominio":5,"objetivo":"5.5","enunciado":"En un ejercicio, un equipo ataca la red mientras el SOC defiende, y ambos comparten resultados en tiempo real para mejorar las detecciones. ¿Qué tipo de equipo describe la colaboración?","opciones":["Equipo rojo (red team) aislado","Equipo azul (blue team) aislado","Equipo púrpura (purple team)","Equipo blanco de auditoría financiera"],"correcta":2,"explicacion":"El purple team integra ataque (red) y defensa (blue) colaborando. El red team solo ataca, el blue team solo defiende; un equipo de auditoría financiera no participa."},{"id":"D5-035","dominio":5,"objetivo":"5.5","enunciado":"Un equipo intenta entrar en la sede de la empresa haciéndose pasar por técnicos de mantenimiento y siguiendo a empleados por las puertas. ¿Qué tipo de prueba es?","opciones":["Escaneo de vulnerabilidades","Prueba de penetración física","Revisión de código","Auditoría de cumplimiento documental"],"correcta":1,"explicacion":"Probar el acceso a instalaciones es una prueba de penetración física. Escanear, revisar código o auditar documentos no evalúan la seguridad física."},{"id":"D5-036","dominio":5,"objetivo":"5.6","enunciado":"En una simulación de phishing, el 22 % de los empleados hace clic. ¿Cuál es la respuesta más eficaz del programa de concienciación?","opciones":["Ofrecer formación específica a quienes hicieron clic y repetir simulaciones periódicas midiendo la evolución","Despedir a todos los que hicieron clic","Dejar de hacer simulaciones porque molestan","Bloquear el correo electrónico de toda la empresa"],"correcta":0,"explicacion":"Un programa eficaz forma, repite y mide. Despedir genera miedo y oculta incidentes; dejar las simulaciones elimina la medición; bloquear el correo no es viable."},{"id":"D5-037","dominio":5,"objetivo":"5.6","enunciado":"Un empleado recibe un correo sospechoso que pide verificar su contraseña. Según las buenas prácticas de concienciación, ¿qué debe hacer?","opciones":["Responder al remitente preguntando si es legítimo","Reenviarlo a todos sus compañeros como advertencia","Hacer clic para comprobar si la web es real","Reportarlo mediante el botón o canal de reporte de phishing sin hacer clic"],"correcta":3,"explicacion":"Reportarlo por el canal oficial permite al equipo de seguridad analizarlo y actuar. Responder o hacer clic expone al usuario; reenviarlo a todos propaga el riesgo."},{"id":"D5-038","dominio":5,"objetivo":"5.6","enunciado":"Un empleado ve que alguien sin tarjeta le sigue de cerca para entrar por la puerta de seguridad. ¿Qué tema de formación aplica a esta situación?","opciones":["Gestión de parches","Conciencia situacional y acceso a remolque (tailgating)","Configuración de RAID","Análisis de vulnerabilidades"],"correcta":1,"explicacion":"Reconocer y frenar el tailgating forma parte de la conciencia situacional y la seguridad física. Las demás opciones son temas técnicos ajenos al comportamiento del usuario."},{"id":"D5-039","dominio":5,"objetivo":"5.6","enunciado":"Una empresa que adopta el teletrabajo quiere actualizar su formación. ¿Qué tema es especialmente relevante?","opciones":["Configuración de bolardos en el aparcamiento","Cálculo de MTBF de discos","Gestión de certificados de la CA raíz","Seguridad en entornos remotos e híbridos: Wi-Fi doméstica, VPN, privacidad de pantalla"],"correcta":3,"explicacion":"El teletrabajo introduce riesgos de redes domésticas, espacios compartidos y acceso remoto. Bolardos, MTBF y gestión de la CA no son temas de formación del usuario remoto."},{"id":"D5-040","dominio":5,"objetivo":"5.6","enunciado":"Un empleado nota que un compañero copia grandes cantidades de datos de clientes a un USB personal fuera de su horario habitual. ¿Qué debe saber reconocer gracias a la formación?","opciones":["Un procedimiento normal de copia de seguridad","Una prueba de penetración autorizada","Comportamiento anómalo o de riesgo que debe reportarse (posible amenaza interna)","Un cambio aprobado por el CAB"],"correcta":2,"explicacion":"La formación enseña a reconocer comportamientos inesperados o de riesgo y a reportarlos, como posibles amenazas internas. No es un procedimiento normal ni hay indicios de prueba o cambio autorizados."}]</script>
<script>
(function () {
  "use strict";
  var PREGUNTAS = JSON.parse(document.getElementById("datos").textContent);
  var POR_ID = {};
  PREGUNTAS.forEach(function (p) { POR_ID[p.id] = p; });
  var DOMINIOS = {
    1: "Conceptos generales de seguridad",
    2: "Amenazas, vulnerabilidades y mitigaciones",
    3: "Arquitectura de seguridad",
    4: "Operaciones de seguridad",
    5: "Gestión y supervisión del programa"
  };
  var PESOS = { 1: 12, 2: 22, 3: 18, 4: 28, 5: 20 };
  var EXAMEN_N = 90, EXAMEN_MIN = 90;
  var LETRAS = ["A", "B", "C", "D"];
  var CLAVE = "secplus701-quiz-v1";
  var app = document.getElementById("app");

  // ---------- almacenamiento (siempre en try/catch) ----------
  function leer() {
    try { var v = JSON.parse(localStorage.getItem(CLAVE)); if (v && typeof v === "object") return v; } catch (e) {}
    return {};
  }
  var guardado = leer();
  guardado.falladas = Array.isArray(guardado.falladas) ? guardado.falladas.filter(function (id) { return POR_ID[id]; }) : [];
  guardado.stats = guardado.stats || {};
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(guardado)); } catch (e) {} }

  // ---------- tema ----------
  function aplicarTema(t) { if (t) document.documentElement.setAttribute("data-theme", t); }
  aplicarTema(guardado.tema);
  document.getElementById("tema").addEventListener("click", function () {
    var actual = document.documentElement.getAttribute("data-theme") ||
      (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    guardado.tema = actual === "dark" ? "light" : "dark";
    aplicarTema(guardado.tema); guardar();
  });

  // ---------- utilidades ----------
  function mezclar(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function el(html) { var d = document.createElement("div"); d.innerHTML = html; return d; }
  function enfocar(sel) { var n = app.querySelector(sel); if (n) n.focus(); }

  // ---------- sesión ----------
  var S = null; // {modo, items:[{id, orden:[...]}], resp:[], idx, fin, revisado:[]}
  var reloj = null;

  function nuevaSesion(modo, ids) {
    S = {
      modo: modo,
      items: ids.map(function (id) { return { id: id, orden: mezclar([0, 1, 2, 3]) }; }),
      resp: ids.map(function () { return null; }),
      idx: 0,
      fin: modo === "examen" ? Date.now() + EXAMEN_MIN * 60000 : null
    };
    guardarSesion();
    pintarPregunta();
  }
  function guardarSesion() { guardado.sesion = S; guardar(); }

  function idsPorDominio(doms) {
    return PREGUNTAS.filter(function (p) { return doms.indexOf(p.dominio) >= 0; }).map(function (p) { return p.id; });
  }

  function seleccionExamen() {
    var ids = [], resto = [];
    Object.keys(PESOS).forEach(function (d) {
      var del = mezclar(idsPorDominio([+d]));
      var n = Math.round(EXAMEN_N * PESOS[d] / 100);
      ids = ids.concat(del.slice(0, n)); resto = resto.concat(del.slice(n));
    });
    ids = ids.concat(mezclar(resto)).slice(0, EXAMEN_N);
    return mezclar(ids);
  }

  // ---------- pantalla inicial ----------
  function pintarInicio() {
    pararReloj();
    var cfg = guardado.cfg || { doms: [1, 2, 3, 4, 5], n: 20 };
    var h = '<section class="card"><h2>Práctica</h2>' +
      '<fieldset class="doms"><legend class="muted">Dominios</legend>';
    Object.keys(DOMINIOS).forEach(function (d) {
      var tot = idsPorDominio([+d]).length;
      var st = guardado.stats[d];
      var pct = st && st.t ? " · aciertos " + Math.round(100 * st.c / st.t) + " %" : "";
      h += '<label><input type="checkbox" name="dom" value="' + d + '"' + (cfg.doms.indexOf(+d) >= 0 ? " checked" : "") + '>' +
        '<span><strong>' + d + '.</strong> ' + esc(DOMINIOS[d]) + ' <span class="muted">(' + PESOS[d] + ' % · ' + tot + ' preg.' + pct + ')</span></span></label>';
    });
    h += '</fieldset><div class="row"><label for="num">Número de preguntas</label>' +
      '<input id="num" class="num" type="number" min="1" max="200" value="' + cfg.n + '"></div>' +
      '<p class="muted" id="aviso" role="status"></p>' +
      '<div class="row"><button class="btn primary" id="empezar" type="button">Empezar práctica</button></div></section>' +
      '<section class="card"><h2>Modo examen</h2><p class="muted">' + EXAMEN_N + ' preguntas de todos los dominios (según su peso), ' + EXAMEN_MIN +
      ' minutos. Las explicaciones se muestran al final.</p><button class="btn primary" id="examen" type="button">Empezar examen</button></section>' +
      '<section class="card"><h2>Repaso de falladas</h2><p class="muted">Preguntas falladas pendientes: <strong>' + guardado.falladas.length +
      '</strong>. Se eliminan de la lista al acertarlas.</p><div class="row"><button class="btn" id="repaso" type="button"' +
      (guardado.falladas.length ? "" : " disabled") + '>Repasar falladas</button>' +
      '<button class="btn" id="borrar" type="button">Borrar progreso</button></div></section>';
    if (S && S.resp.some(function (r) { return r === null; })) {
      h = '<section class="card"><h2>Sesión en curso</h2><p class="muted">' + (S.modo === "examen" ? "Examen" : "Práctica") + ': ' +
        S.resp.filter(function (r) { return r !== null; }).length + ' de ' + S.items.length + ' respondidas.</p>' +
        '<div class="row"><button class="btn primary" id="continuar" type="button">Continuar</button>' +
        '<button class="btn" id="descartar" type="button">Descartar</button></div></section>' + h;
    }
    app.innerHTML = h;

    function on(id, fn) { var b = document.getElementById(id); if (b) b.addEventListener("click", fn); }
    on("empezar", function () {
      var doms = [].slice.call(app.querySelectorAll('input[name="dom"]:checked')).map(function (i) { return +i.value; });
      var n = parseInt(document.getElementById("num").value, 10);
      var aviso = document.getElementById("aviso");
      if (!doms.length) { aviso.textContent = "Elige al menos un dominio."; return; }
      if (!(n > 0)) { aviso.textContent = "Indica un número de preguntas válido."; return; }
      var ids = mezclar(idsPorDominio(doms));
      n = Math.min(n, ids.length);
      guardado.cfg = { doms: doms, n: n };
      nuevaSesion("practica", ids.slice(0, n));
    });
    on("examen", function () { nuevaSesion("examen", seleccionExamen()); });
    on("repaso", function () { nuevaSesion("repaso", mezclar(guardado.falladas)); });
    on("borrar", function () {
      if (!confirm("¿Borrar estadísticas, falladas y sesión en curso?")) return;
      guardado = { tema: guardado.tema, falladas: [], stats: {} }; S = null; guardar(); pintarInicio();
    });
    on("continuar", function () { pintarPregunta(); });
    on("descartar", function () { S = null; guardado.sesion = null; guardar(); pintarInicio(); });
    enfocar(S ? "#continuar" : "#empezar");
  }

  // ---------- reloj (modo examen) ----------
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function tickReloj() {
    var t = document.getElementById("reloj");
    if (!S || !S.fin || !t) return;
    var ms = S.fin - Date.now();
    if (ms <= 0) { pararReloj(); terminar(); return; }
    var m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60;
    t.textContent = m + ":" + (s < 10 ? "0" : "") + s;
    t.classList.toggle("low", ms < 5 * 60000);
  }

  // ---------- pregunta ----------
  function pintarPregunta() {
    pararReloj();
    var it = S.items[S.idx], p = POR_ID[it.id], r = S.resp[S.idx];
    var examen = S.modo === "examen";
    var corregir = !examen && r !== null;
    var respondidas = S.resp.filter(function (x) { return x !== null; }).length;
    var h = '<section class="card">';
    h += '<div class="meta"><span>Pregunta ' + (S.idx + 1) + ' de ' + S.items.length + '</span><span>Dominio ' + p.dominio + ' · Obj. ' + esc(p.objetivo) + '</span>' +
      (examen ? '<span>⏱ <span class="timer" id="reloj" role="timer" aria-label="Tiempo restante"></span></span>' : '') + '</div>';
    h += '<div class="bar" aria-hidden="true"><i style="width:' + (100 * respondidas / S.items.length) + '%"></i></div>';
    if (examen) {
      h += '<details class="ir"' + (guardado.irAbierto ? ' open' : '') + '><summary>Ir a pregunta…</summary><nav class="dots" aria-label="Ir a pregunta">';
      S.items.forEach(function (_, i) {
        h += '<button type="button" data-ir="' + i + '" class="' + (S.resp[i] !== null ? "done " : "") + (i === S.idx ? "cur" : "") +
          '" aria-label="Pregunta ' + (i + 1) + (S.resp[i] !== null ? ', respondida' : '') + '"' + (i === S.idx ? ' aria-current="true"' : '') + '>' + (i + 1) + '</button>';
      });
      h += '</nav></details>';
    }
    h += '<p class="q" id="enunciado">' + esc(p.enunciado) + '</p>';
    h += '<div class="opts" role="radiogroup" aria-labelledby="enunciado">';
    it.orden.forEach(function (o, k) {
      var cls = "opt";
      if (corregir) { if (o === p.correcta) cls += " ok"; else if (o === r) cls += " bad"; }
      h += '<button type="button" role="radio" class="' + cls + '" data-o="' + o + '" aria-checked="' + (r === o) + '"' +
        (corregir ? " disabled" : "") + ' tabindex="' + ((r === o || (r === null && k === 0)) ? 0 : -1) + '">' +
        '<span class="k" aria-hidden="true">' + LETRAS[k] + '</span><span>' + esc(p.opciones[o]) + '</span></button>';
    });
    h += '</div>';
    if (corregir) {
      var ok = r === p.correcta;
      h += '<div class="exp ' + (ok ? "ok" : "bad") + '" role="status"><strong>' + (ok ? "✔ Correcto." : "✘ Incorrecto. Respuesta: " + esc(p.opciones[p.correcta])) +
        '</strong><br>' + esc(p.explicacion) + '</div>';
    }
    h += '<div class="row">';
    if (examen) {
      h += '<button class="btn" id="ant" type="button"' + (S.idx === 0 ? " disabled" : "") + '>← Anterior</button>' +
        '<button class="btn primary" id="sig" type="button">' + (S.idx === S.items.length - 1 ? "Revisar y terminar" : "Siguiente →") + '</button>' +
        '<button class="btn" id="terminar" type="button">Terminar examen</button>';
    } else {
      h += '<button class="btn primary" id="sig" type="button"' + (r === null ? " disabled" : "") + '>' +
        (S.idx === S.items.length - 1 ? "Ver resultados" : "Siguiente →") + '</button>';
    }
    h += '<button class="btn" id="salir" type="button">Salir</button></div>';
    h += '<p class="muted">Teclado: 1–4 o A–D para responder, flechas para moverse entre opciones, Intro para continuar.</p></section>';
    app.innerHTML = h;

    var opts = [].slice.call(app.querySelectorAll(".opt"));
    opts.forEach(function (b, k) {
      b.addEventListener("click", function () { elegir(+b.getAttribute("data-o")); });
      b.addEventListener("keydown", function (e) {
        var d = (e.key === "ArrowDown" || e.key === "ArrowRight") ? 1 : (e.key === "ArrowUp" || e.key === "ArrowLeft") ? -1 : 0;
        if (d) { e.preventDefault(); opts[(k + d + opts.length) % opts.length].focus(); }
      });
    });
    var det = app.querySelector("details.ir");
    if (det) det.addEventListener("toggle", function () { guardado.irAbierto = det.open; guardar(); });
    [].slice.call(app.querySelectorAll("[data-ir]")).forEach(function (b) {
      b.addEventListener("click", function () { S.idx = +b.getAttribute("data-ir"); guardarSesion(); pintarPregunta(); enfocar(".opt[tabindex='0']"); });
    });
    document.getElementById("sig").addEventListener("click", siguiente);
    var ant = document.getElementById("ant");
    if (ant) ant.addEventListener("click", function () { S.idx--; guardarSesion(); pintarPregunta(); enfocar(".opt[tabindex='0']"); });
    var ter = document.getElementById("terminar");
    if (ter) ter.addEventListener("click", function () {
      var pend = S.resp.filter(function (x) { return x === null; }).length;
      if (!pend || confirm("Quedan " + pend + " preguntas sin responder. ¿Terminar el examen?")) terminar();
    });
    document.getElementById("salir").addEventListener("click", function () { pintarInicio(); });
    if (examen) { tickReloj(); reloj = setInterval(tickReloj, 1000); }
  }

  function elegir(o) {
    if (S.modo !== "examen" && S.resp[S.idx] !== null) return;
    S.resp[S.idx] = o;
    if (S.modo !== "examen") registrar(POR_ID[S.items[S.idx].id], o);
    guardarSesion();
    pintarPregunta();
    enfocar(S.modo === "examen" ? ".opt[aria-checked='true']" : "#sig");
  }

  function registrar(p, o) {
    var ok = o === p.correcta;
    var st = guardado.stats[p.dominio] || { c: 0, t: 0 };
    st.t++; if (ok) st.c++;
    guardado.stats[p.dominio] = st;
    var i = guardado.falladas.indexOf(p.id);
    if (ok && i >= 0) guardado.falladas.splice(i, 1);
    if (!ok && i < 0) guardado.falladas.push(p.id);
  }

  function siguiente() {
    if (S.idx < S.items.length - 1) { S.idx++; guardarSesion(); pintarPregunta(); enfocar(".opt[tabindex='0']"); }
    else if (S.modo === "examen") {
      var pend = S.resp.filter(function (x) { return x === null; }).length;
      if (!pend || confirm("Quedan " + pend + " preguntas sin responder. ¿Terminar el examen?")) terminar();
    } else terminar();
  }

  // ---------- resultados ----------
  function terminar() {
    pararReloj();
    if (S.modo === "examen") S.items.forEach(function (it, i) { registrar(POR_ID[it.id], S.resp[i]); });
    var porDom = {}, aciertos = 0;
    S.items.forEach(function (it, i) {
      var p = POR_ID[it.id], d = porDom[p.dominio] || (porDom[p.dominio] = { c: 0, t: 0 });
      d.t++; if (S.resp[i] === p.correcta) { d.c++; aciertos++; }
    });
    var total = S.items.length, pct = Math.round(100 * aciertos / total);
    var h = '<section class="card"><h2>Resultados' + (S.modo === "examen" ? " del examen" : "") + '</h2>' +
      '<p class="score">' + pct + ' %</p><p class="muted">' + aciertos + ' de ' + total + ' correctas' +
      (S.modo === "examen" ? ' · Referencia orientativa: el examen real se aprueba con 750/900 (≈ 83 %).' : '') + '</p>' +
      '<table><caption class="sr">Puntuación por dominio</caption><thead><tr><th scope="col">Dominio</th><th scope="col" class="n">Aciertos</th><th scope="col" class="n">%</th></tr></thead><tbody>';
    Object.keys(porDom).sort().forEach(function (d) {
      var x = porDom[d];
      h += '<tr><td>' + d + '. ' + esc(DOMINIOS[d]) + '</td><td class="n">' + x.c + '/' + x.t + '</td><td class="n">' + Math.round(100 * x.c / x.t) + '</td></tr>';
    });
    h += '</tbody></table><div class="row" style="margin-top:14px"><button class="btn primary" id="inicio" type="button">Volver al inicio</button>' +
      (guardado.falladas.length ? '<button class="btn" id="repasar" type="button">Repasar falladas (' + guardado.falladas.length + ')</button>' : '') + '</div></section>';
    if (S.modo === "examen") {
      h += '<section class="card"><h2>Revisión con explicaciones</h2>';
      S.items.forEach(function (it, i) {
        var p = POR_ID[it.id], r = S.resp[i], ok = r === p.correcta;
        h += '<div class="rev"><p><span class="tag ' + (ok ? "ok" : "bad") + '">' + (ok ? "Correcta" : r === null ? "Sin responder" : "Incorrecta") +
          '</span> <span class="muted">' + (i + 1) + ' · Obj. ' + esc(p.objetivo) + '</span></p><p><strong>' + esc(p.enunciado) + '</strong></p>' +
          (r !== null && !ok ? '<p>Tu respuesta: ' + esc(p.opciones[r]) + '</p>' : '') +
          '<p>Correcta: <strong>' + esc(p.opciones[p.correcta]) + '</strong></p><p class="muted">' + esc(p.explicacion) + '</p></div>';
      });
      h += '</section>';
    }
    S = null; guardado.sesion = null; guardar();
    app.innerHTML = h;
    document.getElementById("inicio").addEventListener("click", pintarInicio);
    var rp = document.getElementById("repasar");
    if (rp) rp.addEventListener("click", function () { nuevaSesion("repaso", mezclar(guardado.falladas)); });
    enfocar("#inicio");
  }

  // ---------- teclado global ----------
  document.addEventListener("keydown", function (e) {
    if (!S || e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea") return;
    var k = e.key.toUpperCase(), n = "1234".indexOf(k) >= 0 ? +k - 1 : LETRAS.indexOf(k);
    if (n >= 0 && n < 4) {
      var b = app.querySelectorAll(".opt")[n];
      if (b && !b.disabled) { e.preventDefault(); b.click(); }
    } else if (e.key === "Enter" && e.target.classList && e.target.classList.contains("opt") && e.target.disabled) {
      var s = document.getElementById("sig"); if (s && !s.disabled) { e.preventDefault(); s.click(); }
    }
  });

  // ---------- arranque: restaurar sesión válida ----------
  if (guardado.sesion && Array.isArray(guardado.sesion.items) &&
      guardado.sesion.items.every(function (it) { return POR_ID[it.id]; })) {
    S = guardado.sesion;
    if (S.fin && S.fin <= Date.now()) { terminar(); } else { pintarInicio(); }
  } else { pintarInicio(); }
})();
</script>
</body>
</html>
