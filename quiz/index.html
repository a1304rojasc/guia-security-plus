<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5b6570; --border: #d5dae0;
  --accent: #2357c6; --accent-text: #ffffff; --ok: #1d7a3e; --ok-bg: #e5f4ea;
  --bad: #b3261e; --bad-bg: #fbe9e7; --sel: #e6edfb; --focus: #f0a400;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151a; --card: #1c2129; --text: #e7eaee; --muted: #9aa4af; --border: #343c47;
    --accent: #6f9bff; --accent-text: #0b1020; --ok: #6fd18f; --ok-bg: #173323;
    --bad: #ff8a80; --bad-bg: #3a1c1a; --sel: #23324f; --focus: #ffc94d;
  }
}
:root[data-theme="dark"] {
  --bg: #12151a; --card: #1c2129; --text: #e7eaee; --muted: #9aa4af; --border: #343c47;
  --accent: #6f9bff; --accent-text: #0b1020; --ok: #6fd18f; --ok-bg: #173323;
  --bad: #ff8a80; --bad-bg: #3a1c1a; --sel: #23324f; --focus: #ffc94d;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow-wrap: anywhere;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
h1 { font-size: 1.35rem; margin: 0; }
h2 { font-size: 1.15rem; margin: 0 0 12px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.muted { color: var(--muted); font-size: .92rem; }
button, select, input { font: inherit; color: inherit; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 8px 16px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--border); background: var(--card);
}
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.doms { display: grid; gap: 6px; margin: 8px 0 12px; border: 0; padding: 0; }
.doms label { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
.doms input { width: 20px; height: 20px; margin-top: 2px; flex: none; }
.num { width: 90px; min-height: 44px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
.meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; font-size: .9rem; color: var(--muted); margin-bottom: 8px; }
.bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; }
.q { font-size: 1.05rem; font-weight: 600; margin: 0 0 14px; }
.opts { display: grid; gap: 8px; margin: 0 0 14px; padding: 0; list-style: none; }
.opt {
  width: 100%; text-align: left; display: flex; gap: 10px; align-items: flex-start;
  padding: 12px; min-height: 44px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--card); cursor: pointer;
}
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border); display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
.opt[aria-checked="true"] { background: var(--sel); border-color: var(--accent); }
.opt.ok { background: var(--ok-bg); border-color: var(--ok); }
.opt.bad { background: var(--bad-bg); border-color: var(--bad); }
.opt:disabled { cursor: default; color: var(--text); }
.exp { border-left: 4px solid var(--accent); padding: 10px 12px; background: var(--sel); border-radius: 6px; margin-bottom: 14px; }
.exp.ok { border-color: var(--ok); background: var(--ok-bg); }
.exp.bad { border-color: var(--bad); background: var(--bad-bg); }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; }
.timer.low { color: var(--bad); }
table { width: 100%; border-collapse: collapse; font-size: .95rem; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
td.n { text-align: right; font-variant-numeric: tabular-nums; }
.score { font-size: 2rem; font-weight: 800; margin: 0; }
.rev { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; }
.rev p { margin: 4px 0; }
.tag { display: inline-block; font-size: .8rem; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); }
.tag.ok { color: var(--ok); border-color: var(--ok); }
.tag.bad { color: var(--bad); border-color: var(--bad); }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
details.ir { margin-bottom: 12px; }
summary { cursor: pointer; min-height: 32px; color: var(--muted); }
.dots { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
.dots button { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); font-size: .75rem; cursor: pointer; padding: 0; }
.dots button.done { background: var(--sel); border-color: var(--accent); }
.dots button.cur { outline: 2px solid var(--accent); }
@media (max-width: 480px) {
  .wrap { padding: 12px 16px; }
  .row .btn { flex: 1 1 auto; }
}

<script id="datos" type="application/json">[{"id":"D1-001","dominio":1,"objetivo":"1.1","enunciado":"Una empresa coloca en la entrada de su centro de datos un cartel visible que dice «Instalación vigilada 24 h. Los intrusos serán denunciados». ¿Qué tipo de control es?","opciones":["Preventivo (preventive)","Correctivo (corrective)","Disuasorio (deterrent)","Compensatorio (compensating)"],"correcta":2,"explicacion":"Es disuasorio: desanima al intruso pero no le impide físicamente entrar. No es preventivo (eso sería una cerradura o torniquete), ni correctivo (actúa tras el incidente), ni compensatorio (sustituye a otro control inviable)."},{"id":"D1-002","dominio":1,"objetivo":"1.1","enunciado":"Un hospital no puede parchear un equipo de resonancia magnética porque el fabricante perdería la certificación. El equipo de seguridad lo coloca en una VLAN aislada con reglas de firewall estrictas. ¿Qué tipo de control describe mejor esta medida?","opciones":["Directivo (directive)","Compensatorio (compensating)","Detectivo (detective)","Disuasorio (deterrent)"],"correcta":1,"explicacion":"Es compensatorio porque sustituye al control principal (parcheo) que no se puede aplicar. No es directivo (no da instrucciones), ni detectivo (no identifica incidentes), ni disuasorio (no busca desanimar)."},{"id":"D1-003","dominio":1,"objetivo":"1.1","enunciado":"Tras un ataque de ransomware, el equipo de TI restaura los servidores a partir de las copias de seguridad de la noche anterior. ¿Qué tipo de control se ha utilizado?","opciones":["Preventivo (preventive)","Correctivo (corrective)","Detectivo (detective)","Disuasorio (deterrent)"],"correcta":1,"explicacion":"Restaurar backups reduce el impacto y devuelve el sistema a su estado normal tras el incidente: control correctivo. No evitó el ataque (preventivo), no lo detectó (detectivo) ni desanimó al atacante (disuasorio)."},{"id":"D1-004","dominio":1,"objetivo":"1.1","enunciado":"La dirección aprueba una evaluación anual de riesgos y una política de clasificación de datos. ¿A qué categoría de control pertenecen?","opciones":["Gerencial (managerial)","Técnico (technical)","Operacional (operational)","Físico (physical)"],"correcta":0,"explicacion":"Las evaluaciones de riesgo y las políticas las define la gestión: categoría gerencial. Técnico serían firewalls o cifrado; operacional, tareas ejecutadas por personas como la formación o los guardias; físico, cerraduras o vallas."},{"id":"D1-005","dominio":1,"objetivo":"1.1","enunciado":"Un vigilante de seguridad comprueba la identificación de cada visitante en la recepción. ¿A qué categoría de control corresponde principalmente?","opciones":["Operacional (operational)","Gerencial (managerial)","Técnico (technical)","Directivo (directive)"],"correcta":0,"explicacion":"Los guardias son un control operacional: lo ejecutan personas en el día a día. Gerencial se refiere a políticas y evaluación de riesgos; técnico a sistemas; directivo es un tipo (no una categoría) que indica lo que se debe hacer."},{"id":"D1-006","dominio":1,"objetivo":"1.1","enunciado":"Un sistema de detección de intrusiones (IDS) genera una alerta cuando detecta un escaneo de puertos, pero no lo bloquea. ¿Qué tipo de control es?","opciones":["Preventivo (preventive)","Correctivo (corrective)","Compensatorio (compensating)","Detectivo (detective)"],"correcta":3,"explicacion":"El IDS identifica y avisa: control detectivo. Si bloqueara (IPS) sería preventivo. No corrige daños ni sustituye a otro control."},{"id":"D1-007","dominio":1,"objetivo":"1.2","enunciado":"Un administrador quiere garantizar que un archivo descargado no haya sido modificado durante la transferencia. ¿Qué principio de la tríada CIA está protegiendo?","opciones":["Confidencialidad (confidentiality)","Disponibilidad (availability)","No repudio (non-repudiation)","Integridad (integrity)"],"correcta":3,"explicacion":"Verificar que los datos no se alteraron es integridad (se hace con hashes). La confidencialidad evita que otros lean los datos; la disponibilidad garantiza el acceso; el no repudio no forma parte de la tríada y se refiere a no poder negar la autoría."},{"id":"D1-008","dominio":1,"objetivo":"1.2","enunciado":"Un directivo afirma que nunca envió un correo que autorizaba un pago. La empresa demuestra lo contrario porque el correo estaba firmado digitalmente con su clave privada. ¿Qué concepto se aplica?","opciones":["Confidencialidad (confidentiality)","Disponibilidad (availability)","No repudio (non-repudiation)","Contabilidad (accounting)"],"correcta":2,"explicacion":"La firma con la clave privada del emisor impide negar la autoría: no repudio. La confidencialidad protege el contenido de terceros; la disponibilidad el acceso; la contabilidad registra acciones pero no prueba criptográficamente la autoría."},{"id":"D1-009","dominio":1,"objetivo":"1.2","enunciado":"En una arquitectura de confianza cero (Zero Trust), ¿qué componente toma la decisión de conceder o denegar el acceso a un recurso?","opciones":["Punto de aplicación de políticas (PEP)","Motor de políticas (Policy Engine)","Zona implícitamente confiable (implicit trust zone)","Sujeto (subject)"],"correcta":1,"explicacion":"El Policy Engine evalúa y decide. El PEP solo aplica la decisión en el plano de datos; la zona de confianza implícita es el área tras el PEP; el sujeto es quien solicita acceso."},{"id":"D1-010","dominio":1,"objetivo":"1.2","enunciado":"Un analista coloca en un servidor de archivos un documento llamado «Nóminas_directivos_2026.xlsx» que nadie debería abrir, configurado para enviar una alerta al SOC si alguien accede a él. ¿Qué técnica se está usando?","opciones":["Honeynet","Honeyfile","Bastión (jump server)","Tokenización (tokenization)"],"correcta":1,"explicacion":"Un archivo señuelo que alerta al ser abierto es un honeyfile. Una honeynet es una red de honeypots; un jump server es un servidor de administración; la tokenización sustituye datos sensibles por tokens."},{"id":"D1-011","dominio":1,"objetivo":"1.2","enunciado":"Una organización compara sus controles actuales con los del marco NIST CSF para identificar qué le falta y planificar mejoras. ¿Cómo se llama este proceso?","opciones":["Análisis de impacto en el negocio (BIA)","Prueba de penetración (penetration test)","Análisis de brechas (gap analysis)","Análisis de causa raíz (root cause analysis)"],"correcta":2,"explicacion":"Comparar el estado actual con el deseado es un gap analysis. El BIA mide el impacto de interrupciones; el pentest busca explotar vulnerabilidades; el análisis de causa raíz investiga el origen de un incidente."},{"id":"D1-012","dominio":1,"objetivo":"1.2","enunciado":"Para proteger la entrada al centro de datos, una empresa instala un espacio con dos puertas en el que la segunda solo se abre cuando la primera se ha cerrado, impidiendo el acceso a remolque (tailgating). ¿Qué es?","opciones":["Vestíbulo de control de acceso (access control vestibule)","Bolardo (bollard)","Honeypot","Sensor de infrarrojos"],"correcta":0,"explicacion":"El vestíbulo de control de acceso (antes «mantrap») evita que entren dos personas con una sola autenticación. Los bolardos frenan vehículos; un honeypot es un señuelo informático; un sensor infrarrojo detecta presencia pero no controla el paso."},{"id":"D1-013","dominio":1,"objetivo":"1.2","enunciado":"Un usuario introduce su nombre de usuario y su contraseña y, después, el sistema le permite leer pero no modificar una carpeta. ¿Qué paso del modelo AAA determina que solo pueda leer?","opciones":["Autorización (authorization)","Autenticación (authentication)","Contabilidad (accounting)","Identificación (identification)"],"correcta":0,"explicacion":"Decidir qué puede hacer un usuario ya autenticado es autorización. La autenticación prueba la identidad; la contabilidad registra lo que hace; la identificación es declarar quién eres."},{"id":"D1-014","dominio":1,"objetivo":"1.3","enunciado":"Antes de aplicar una actualización crítica en el ERP, el comité de cambios exige un procedimiento documentado para volver a la versión anterior si algo falla. ¿Cómo se llama ese elemento?","opciones":["Análisis de impacto (impact analysis)","Ventana de mantenimiento (maintenance window)","Plan de reversión (backout plan)","Procedimiento operativo estándar (SOP)"],"correcta":2,"explicacion":"El plan de reversión define cómo deshacer el cambio. El análisis de impacto evalúa consecuencias; la ventana de mantenimiento es el horario acordado; un SOP describe tareas rutinarias, no la vuelta atrás de un cambio concreto."},{"id":"D1-015","dominio":1,"objetivo":"1.3","enunciado":"Un equipo aplica un cambio de firewall un martes a las 11:00 sin aprobación y deja sin servicio a la tienda online durante dos horas. ¿Qué elemento de la gestión de cambios habría evitado principalmente el impacto en el negocio?","opciones":["Añadir el firewall a la lista de denegados (deny list)","Instalar un antivirus en el firewall","Programar el cambio en una ventana de mantenimiento aprobada","Crear un honeypot"],"correcta":2,"explicacion":"Una ventana de mantenimiento aprobada sitúa los cambios en horarios de bajo impacto. Las listas de denegados, el antivirus o un honeypot no tienen relación con controlar cuándo y cómo se aplican los cambios."},{"id":"D1-016","dominio":1,"objetivo":"1.3","enunciado":"Tras actualizar una aplicación heredada (legacy), otra aplicación que dependía de una librería antigua deja de funcionar. ¿Qué consideración técnica de la gestión de cambios no se evaluó correctamente?","opciones":["Control de versiones (version control)","Dependencias (dependencies)","Propiedad (ownership)","Lista de permitidos (allow list)"],"correcta":1,"explicacion":"El problema es una dependencia no identificada entre aplicaciones. El control de versiones registra cambios en código/documentos; la propiedad identifica al responsable; la allow list restringe qué software se ejecuta."},{"id":"D1-017","dominio":1,"objetivo":"1.3","enunciado":"Después de implementar un cambio aprobado en la red, ¿qué debe actualizarse para que el equipo de respuesta a incidentes trabaje con información correcta?","opciones":["La política de uso aceptable (AUP)","El contrato con el proveedor de internet","Diagramas de red y documentación asociada","La lista de revocación de certificados (CRL)"],"correcta":2,"explicacion":"La gestión de cambios incluye actualizar diagramas, políticas y procedimientos afectados. La AUP regula el uso por los empleados, el contrato del ISP no se ve afectado y la CRL lista certificados revocados."},{"id":"D1-018","dominio":1,"objetivo":"1.4","enunciado":"Alicia quiere enviar a Roberto un archivo que solo Roberto pueda descifrar. ¿Qué clave debe usar Alicia para cifrarlo?","opciones":["La clave privada de Roberto","La clave privada de Alicia","La clave pública de Alicia","La clave pública de Roberto"],"correcta":3,"explicacion":"Para confidencialidad se cifra con la clave pública del destinatario; solo su clave privada la descifra. Alicia no tiene la privada de Roberto; cifrar con la privada de Alicia sería firmar (cualquiera podría descifrar con su pública); la pública de Alicia solo la descifraría Alicia."},{"id":"D1-019","dominio":1,"objetivo":"1.4","enunciado":"Una empresa almacena las contraseñas de los usuarios con SHA-256. Un auditor recomienda añadir un valor aleatorio único a cada contraseña antes de calcular el hash. ¿Qué ataque mitiga principalmente esta recomendación?","opciones":["Ataques de degradación (downgrade)","Ataques con tablas arcoíris (rainbow tables)","Ataques de repetición (replay)","Ataques en ruta (on-path)"],"correcta":1,"explicacion":"La sal (salt) hace que hashes de contraseñas iguales sean distintos e inutiliza las tablas precalculadas. Un downgrade fuerza protocolos débiles, un replay reutiliza tráfico capturado y un on-path intercepta comunicaciones: la sal no los mitiga."},{"id":"D1-020","dominio":1,"objetivo":"1.4","enunciado":"Un comercio electrónico quiere que sus sistemas internos procesen pedidos sin almacenar los números reales de tarjeta, sustituyéndolos por valores sin significado que un servicio externo puede mapear al número real. ¿Qué técnica usa?","opciones":["Tokenización (tokenization)","Esteganografía (steganography)","Hashing","Enmascaramiento (data masking)"],"correcta":0,"explicacion":"La tokenización reemplaza el dato por un token y guarda la correspondencia en una bóveda segura. La esteganografía oculta datos en otros archivos; un hash no se puede revertir al número original; el enmascaramiento solo oculta parte del dato al mostrarlo."},{"id":"D1-021","dominio":1,"objetivo":"1.4","enunciado":"Un banco necesita generar y proteger millones de claves criptográficas con alto rendimiento y protección física contra manipulación. ¿Qué solución es la más adecuada?","opciones":["TPM (Trusted Platform Module)","Certificado autofirmado (self-signed)","Esteganografía","HSM (Hardware Security Module)"],"correcta":3,"explicacion":"Un HSM es un dispositivo dedicado, resistente a manipulación y diseñado para gestionar claves a gran escala. El TPM es un chip de un solo equipo; un certificado autofirmado no gestiona claves; la esteganografía oculta información."},{"id":"D1-022","dominio":1,"objetivo":"1.4","enunciado":"Un navegador necesita comprobar en tiempo real si el certificado de un sitio web ha sido revocado, sin descargar una lista completa. ¿Qué mecanismo utiliza?","opciones":["CRL (Certificate Revocation List)","CSR (Certificate Signing Request)","Key escrow","OCSP (Online Certificate Status Protocol)"],"correcta":3,"explicacion":"OCSP consulta el estado de un certificado concreto en tiempo real. La CRL es una lista que se descarga periódicamente; el CSR se usa para solicitar un certificado; el key escrow guarda copias de claves."},{"id":"D1-023","dominio":1,"objetivo":"1.4","enunciado":"¿Qué afirmación describe correctamente la diferencia entre cifrado simétrico y asimétrico?","opciones":["El simétrico usa una única clave compartida y es más rápido; el asimétrico usa un par de claves y suele emplearse para intercambiar claves y firmar","El simétrico usa un par de claves y el asimétrico una única clave","El asimétrico es más rápido y por eso se usa para cifrar grandes volúmenes de datos","Ambos usan las mismas claves y solo cambia la longitud"],"correcta":0,"explicacion":"El cifrado simétrico (AES) usa una clave compartida y es rápido; el asimétrico (RSA, ECC) usa clave pública/privada, es más lento y se usa para intercambio de claves y firmas. Las demás opciones invierten o confunden estas características."},{"id":"D1-024","dominio":1,"objetivo":"1.4","enunciado":"Un portátil corporativo usa cifrado de disco completo y almacena la clave en un chip de la placa base que también verifica que el proceso de arranque no ha sido alterado. ¿Qué componente es?","opciones":["HSM (Hardware Security Module)","KMS (Key Management System)","CA (Certificate Authority)","TPM (Trusted Platform Module)"],"correcta":3,"explicacion":"El TPM está integrado en la placa, guarda claves (p. ej. BitLocker) y permite el arranque medido. El HSM es un dispositivo externo dedicado; el KMS es un servicio de gestión centralizada; la CA emite certificados."},{"id":"D2-001","dominio":2,"objetivo":"2.1","enunciado":"Un grupo con amplios recursos lleva meses dentro de la red de un fabricante de defensa, moviéndose con sigilo y exfiltrando planos de forma lenta. ¿Qué actor de amenaza es el más probable?","opciones":["Hacktivista (hacktivist)","Estado-nación (nation-state)","Atacante sin experiencia (unskilled attacker)","TI en la sombra (shadow IT)"],"correcta":1,"explicacion":"Persistencia prolongada, sigilo, grandes recursos y espionaje industrial-militar son rasgos de una APT de estado-nación. Un hacktivista busca visibilidad ideológica; un aficionado no tiene esa sofisticación; el shadow IT no es malicioso."},{"id":"D2-002","dominio":2,"objetivo":"2.1","enunciado":"Tras anunciar la apertura de una mina, la web de una empresa sufre un DDoS y su página principal es sustituida por un mensaje en defensa del medio ambiente. ¿Qué actor y motivación encajan mejor?","opciones":["Crimen organizado con motivación económica","Hacktivista con motivación ideológica","Estado-nación con motivación de espionaje","Amenaza interna con motivación de venganza"],"correcta":1,"explicacion":"El defacement con un mensaje político/ambiental es típico de hacktivistas. El crimen organizado busca dinero (ransomware, fraude); un estado-nación actuaría con sigilo; nada indica a un empleado vengativo."},{"id":"D2-003","dominio":2,"objetivo":"2.1","enunciado":"El departamento de marketing contrata por su cuenta una herramienta SaaS de análisis y sube a ella datos de clientes sin informar a TI. ¿Cómo se clasifica esta amenaza?","opciones":["Amenaza persistente avanzada (APT)","TI en la sombra (shadow IT)","Hacktivismo","Ataque a la cadena de suministro (supply chain)"],"correcta":1,"explicacion":"Usar tecnología no aprobada por TI es shadow IT, normalmente sin intención maliciosa. No es una APT ni hacktivismo; tampoco es un ataque a la cadena de suministro, que implicaría comprometer a un proveedor."},{"id":"D2-004","dominio":2,"objetivo":"2.1","enunciado":"Un grupo cifra los servidores de un hospital y exige 2 millones en criptomonedas, ofreciendo además «soporte» para pagar. ¿Qué actor y motivación son más probables?","opciones":["Hacktivista, motivación filosófica","Estado-nación, motivación de guerra","Crimen organizado, motivación económica","Atacante sin experiencia, motivación de notoriedad"],"correcta":2,"explicacion":"El ransomware con estructura de «servicio» y pago es típico del crimen organizado con fines económicos. Los hacktivistas buscan difundir un mensaje; un estado-nación prioriza espionaje o disrupción; un aficionado no suele operar con esa estructura."},{"id":"D2-005","dominio":2,"objetivo":"2.1","enunciado":"Un administrador de sistemas descontento, que sabe que va a ser despedido, crea una cuenta oculta para acceder después de su salida. ¿Qué tipo de actor representa?","opciones":["Hacktivista","Estado-nación","Atacante sin experiencia (unskilled attacker)","Amenaza interna (insider threat)"],"correcta":3,"explicacion":"Es alguien con acceso legítimo que lo usa de forma maliciosa: amenaza interna, con motivación probable de venganza. Los demás actores son externos y no tienen acceso legítimo previo."},{"id":"D2-006","dominio":2,"objetivo":"2.1","enunciado":"Un adolescente descarga una herramienta de DDoS de un foro y la lanza contra el servidor de juegos de su instituto sin entender cómo funciona. ¿Qué actor describe?","opciones":["Crimen organizado","Estado-nación","Atacante sin experiencia (unskilled attacker)","Amenaza interna"],"correcta":2,"explicacion":"Usar herramientas ajenas sin conocimientos es el perfil del atacante sin experiencia (script kiddie). No tiene los recursos del crimen organizado ni de un estado-nación, ni es un empleado con acceso."},{"id":"D2-007","dominio":2,"objetivo":"2.2","enunciado":"Varios empleados reciben un SMS que simula ser de su banco y les pide confirmar su PIN en un enlace. ¿Qué técnica es?","opciones":["Smishing","Vishing","Whaling","Watering hole"],"correcta":0,"explicacion":"Phishing por SMS es smishing. Vishing es por voz; whaling se dirige a altos directivos; watering hole consiste en infectar un sitio web que visitan las víctimas."},{"id":"D2-008","dominio":2,"objetivo":"2.2","enunciado":"El director financiero recibe una llamada de alguien que se hace pasar por el CEO y le pide una transferencia urgente, explicando que está cerrando una adquisición confidencial. ¿Qué técnicas se combinan?","opciones":["Smishing y typosquatting","Watering hole y spear phishing","Vishing y pretexto (pretexting)","Typosquatting y suplantación de marca"],"correcta":2,"explicacion":"Es una llamada (vishing) con una historia inventada para justificar la petición (pretexting), además de suplantación. No hay SMS, dominios mal escritos ni sitios web infectados."},{"id":"D2-009","dominio":2,"objetivo":"2.2","enunciado":"Los empleados de una empresa aeronáutica visitan a menudo un foro técnico del sector. Un atacante compromete ese foro para infectar a quienes lo visitan. ¿Qué tipo de ataque es?","opciones":["Typosquatting","Whaling","Smishing","Abrevadero (watering hole)"],"correcta":3,"explicacion":"Infectar un sitio legítimo frecuentado por el objetivo es un ataque de abrevadero. Typosquatting registra dominios mal escritos; whaling es phishing a directivos; smishing es por SMS."},{"id":"D2-010","dominio":2,"objetivo":"2.2","enunciado":"Un atacante registra el dominio «rnicrosoft.com» (con «rn» en lugar de «m») para engañar a los usuarios. ¿Cómo se llama esta técnica?","opciones":["Pretexting","Typosquatting","Watering hole","Vishing"],"correcta":1,"explicacion":"Registrar dominios parecidos con errores tipográficos es typosquatting. Pretexting es una historia inventada; watering hole compromete un sitio frecuentado; vishing es por voz."},{"id":"D2-011","dominio":2,"objetivo":"2.2","enunciado":"Un empleado encuentra un USB con la etiqueta «Bonificaciones 2026» en el aparcamiento y lo conecta a su equipo. ¿Qué vector de amenaza se ha aprovechado?","opciones":["Credenciales por defecto (default credentials)","Medios extraíbles (removable devices)","Red inalámbrica insegura","Software sin soporte (unsupported software)"],"correcta":1,"explicacion":"Dejar USB infectados para que alguien los conecte explota el vector de medios extraíbles. No intervienen contraseñas por defecto, redes Wi-Fi ni software sin soporte."},{"id":"D2-012","dominio":2,"objetivo":"2.2","enunciado":"Un auditor descubre que las cámaras IP de la empresa siguen usando el usuario «admin» y la contraseña «admin». ¿Qué vector de ataque representa?","opciones":["Typosquatting","Cadena de suministro (supply chain)","Credenciales por defecto (default credentials)","Ingeniería social"],"correcta":2,"explicacion":"Mantener las credenciales de fábrica es un vector clásico. Typosquatting usa dominios, la cadena de suministro implica a proveedores comprometidos y la ingeniería social manipula a personas."},{"id":"D2-013","dominio":2,"objetivo":"2.2","enunciado":"Un proveedor de servicios gestionados (MSP) con acceso remoto a los clientes es comprometido y los atacantes usan ese acceso para desplegar ransomware en todos sus clientes. ¿Qué tipo de vector es?","opciones":["Medios extraíbles","Watering hole","Puertos abiertos","Cadena de suministro (supply chain) a través de un proveedor de servicios"],"correcta":3,"explicacion":"Comprometer a un proveedor para llegar a sus clientes es un ataque a la cadena de suministro (MSP). No intervienen USB, sitios web infectados ni un puerto concreto expuesto."},{"id":"D2-014","dominio":2,"objetivo":"2.2","enunciado":"Un consejero delegado recibe un correo muy personalizado, con datos de su agenda real, que le pide revisar un «documento del consejo». ¿Cuál es el término más preciso?","opciones":["Smishing","Vishing","Whaling","Typosquatting"],"correcta":2,"explicacion":"Phishing dirigido específicamente a altos directivos es whaling (una forma de spear phishing). Smishing es por SMS y vishing por voz; typosquatting se refiere a dominios mal escritos."},{"id":"D2-015","dominio":2,"objetivo":"2.2","enunciado":"Un proveedor real de la empresa tiene su cuenta de correo comprometida. Desde ella, el atacante envía una factura legítima con un número de cuenta bancaria cambiado. ¿Qué ataque es?","opciones":["Compromiso de correo empresarial (BEC)","Typosquatting","Watering hole","Desinformación (disinformation)"],"correcta":0,"explicacion":"Usar una cuenta de correo legítima comprometida para fraude financiero es BEC. Typosquatting usaría un dominio falso; watering hole un sitio web; la desinformación busca difundir información falsa, no un pago."},{"id":"D2-016","dominio":2,"objetivo":"2.3","enunciado":"Una aplicación comprueba que un usuario tiene permiso sobre un archivo y, milisegundos después, lo abre. Un atacante sustituye el archivo por un enlace simbólico entre ambas acciones. ¿Qué vulnerabilidad explota?","opciones":["Desbordamiento de búfer (buffer overflow)","Inyección SQL","Escape de máquina virtual (VM escape)","Condición de carrera TOCTOU (time-of-check to time-of-use)"],"correcta":3,"explicacion":"El cambio entre la comprobación y el uso es una condición de carrera TOCTOU. Un buffer overflow escribe más allá de un búfer; la inyección SQL manipula consultas; el VM escape sale de una máquina virtual."},{"id":"D2-017","dominio":2,"objetivo":"2.3","enunciado":"Un atacante envía a un programa una entrada mucho más larga de lo esperado, sobrescribe memoria adyacente y consigue ejecutar su propio código. ¿Qué vulnerabilidad es?","opciones":["Condición de carrera (race condition)","Cross-site scripting (XSS)","Configuración errónea en la nube","Desbordamiento de búfer (buffer overflow)"],"correcta":3,"explicacion":"Escribir más datos de los que caben en un búfer y sobrescribir memoria es un buffer overflow. La condición de carrera depende del tiempo; XSS inyecta scripts en webs; la configuración errónea en la nube es un fallo de ajustes."},{"id":"D2-018","dominio":2,"objetivo":"2.3","enunciado":"Un atacante con acceso a una máquina virtual consigue ejecutar código en el hipervisor y acceder a otras máquinas virtuales del mismo host. ¿Qué vulnerabilidad aprovecha?","opciones":["Escape de máquina virtual (VM escape)","Carga lateral (side loading)","Typosquatting","Inyección en memoria (memory injection)"],"correcta":0,"explicacion":"Salir de la VM hacia el hipervisor es un VM escape. La carga lateral instala apps fuera de la tienda oficial; typosquatting usa dominios; la inyección en memoria es otra técnica de aplicación pero no describe salir del aislamiento de la VM."},{"id":"D2-019","dominio":2,"objetivo":"2.3","enunciado":"Un empleado instala en su móvil corporativo una aplicación descargada desde un sitio web, fuera de la tienda oficial. ¿Qué vulnerabilidad móvil describe?","opciones":["Jailbreak","Carga lateral (side loading)","VM escape","Día cero (zero-day)"],"correcta":1,"explicacion":"Instalar apps desde fuentes no oficiales es side loading. El jailbreak elimina las restricciones del sistema operativo; VM escape afecta a la virtualización; un día cero es una vulnerabilidad sin parche."},{"id":"D2-020","dominio":2,"objetivo":"2.3","enunciado":"Un bucket de almacenamiento en la nube con copias de seguridad de clientes es accesible públicamente porque se dejó con permisos de lectura para «todos». ¿Qué tipo de vulnerabilidad es?","opciones":["Configuración errónea (misconfiguration) en la nube","Desbordamiento de búfer","Vulnerabilidad de firmware","Condición de carrera"],"correcta":0,"explicacion":"Permisos excesivos en un recurso cloud son una configuración errónea, una de las causas más comunes de fugas. No hay fallo de memoria, firmware ni de concurrencia."},{"id":"D2-021","dominio":2,"objetivo":"2.3","enunciado":"Se publica un exploit para una vulnerabilidad que el fabricante desconocía y para la que no existe parche. ¿Cómo se denomina?","opciones":["Vulnerabilidad de fin de vida (end-of-life)","Configuración errónea","Vulnerabilidad de día cero (zero-day)","Vulnerabilidad heredada (legacy)"],"correcta":2,"explicacion":"Una vulnerabilidad sin parche disponible y desconocida previamente es de día cero. Fin de vida significa que el producto ya no recibe parches; configuración errónea es un fallo de ajustes; legacy se refiere a sistemas antiguos."},{"id":"D2-022","dominio":2,"objetivo":"2.3","enunciado":"Un fabricante de software es comprometido y los atacantes insertan código malicioso en la actualización oficial firmada que reciben miles de clientes. ¿Cómo se clasifica?","opciones":["Carga lateral (side loading)","Actualización maliciosa (malicious update) / riesgo de cadena de suministro de software","Typosquatting","Inyección SQL"],"correcta":1,"explicacion":"Una actualización legítima con código malicioso es un caso de malicious update en la cadena de suministro. No es side loading (fuente no oficial), ni typosquatting, ni una inyección SQL."},{"id":"D2-023","dominio":2,"objetivo":"2.3","enunciado":"Una fábrica usa un sistema de control que funciona sobre un sistema operativo que el fabricante dejó de soportar hace tres años. ¿Qué tipo de vulnerabilidad representa?","opciones":["Fin de vida (end-of-life) / sistema heredado","Día cero (zero-day)","Condición de carrera","Side loading"],"correcta":0,"explicacion":"Sin soporte del fabricante no hay parches: vulnerabilidad de fin de vida/legacy. Un día cero es un fallo aún no conocido; las otras opciones son fallos de aplicación y móviles."},{"id":"D2-024","dominio":2,"objetivo":"2.3","enunciado":"Un servidor web usa TLS 1.0 con suites de cifrado basadas en RC4. ¿Qué tipo de vulnerabilidad es?","opciones":["Escape de máquina virtual","Carga lateral","Desbordamiento de búfer","Criptográfica (algoritmos o protocolos débiles)"],"correcta":3,"explicacion":"Protocolos y algoritmos obsoletos son vulnerabilidades criptográficas que permiten ataques de degradación o descifrado. Las otras opciones son de virtualización, móvil y memoria."},{"id":"D2-025","dominio":2,"objetivo":"2.4","enunciado":"Varios servidores muestran archivos con extensión «.locked» y en cada carpeta aparece un archivo «LEEME.txt» con instrucciones de pago. ¿Qué malware es?","opciones":["Spyware","Ransomware","Keylogger","Bloatware"],"correcta":1,"explicacion":"Archivos cifrados con nueva extensión y nota de rescate son indicadores de ransomware. El spyware espía sin avisar, el keylogger registra teclas y el bloatware es software innecesario preinstalado."},{"id":"D2-026","dominio":2,"objetivo":"2.4","enunciado":"Un malware se propaga automáticamente entre cientos de equipos explotando una vulnerabilidad de SMB, sin que ningún usuario abra archivos. ¿Qué tipo de malware es?","opciones":["Gusano (worm)","Virus","Troyano (trojan)","Bomba lógica (logic bomb)"],"correcta":0,"explicacion":"La autopropagación sin intervención del usuario define a un gusano. El virus necesita que el usuario ejecute algo; el troyano se disfraza de software legítimo; la bomba lógica espera una condición."},{"id":"D2-027","dominio":2,"objetivo":"2.4","enunciado":"Un programador incluye código que borrará la base de datos de nóminas si su nombre deja de aparecer en la lista de empleados. ¿Qué es?","opciones":["Bomba lógica (logic bomb)","Gusano (worm)","Rootkit","RAT"],"correcta":0,"explicacion":"Código que se activa ante una condición concreta es una bomba lógica. El gusano se propaga solo, el rootkit se oculta en el sistema y el RAT da acceso remoto."},{"id":"D2-028","dominio":2,"objetivo":"2.4","enunciado":"Un usuario descarga un «optimizador de PC gratis» que funciona, pero además abre una conexión remota permanente con un servidor del atacante. ¿Qué describe mejor este malware?","opciones":["Gusano (worm)","Troyano de acceso remoto (RAT)","Bomba lógica","Ransomware"],"correcta":1,"explicacion":"Software aparentemente legítimo que da control remoto al atacante es un RAT (un tipo de troyano). No se autopropaga (gusano), no espera una condición (bomba lógica) ni cifra datos (ransomware)."},{"id":"D2-029","dominio":2,"objetivo":"2.4","enunciado":"El EDR detecta un ataque que se ejecuta íntegramente en memoria usando PowerShell y WMI, sin dejar ejecutables en el disco. ¿Qué tipo de malware es?","opciones":["Bloatware","Virus de macro","Malware sin archivos (fileless)","Keylogger físico"],"correcta":2,"explicacion":"Ejecutarse en memoria con herramientas legítimas del sistema es característico del malware fileless. El bloatware es software innecesario; un virus de macro vive en documentos; un keylogger físico es un dispositivo de hardware."},{"id":"D2-030","dominio":2,"objetivo":"2.4","enunciado":"El SIEM registra en una hora intentos de inicio de sesión fallidos contra 3 000 cuentas distintas usando solo las contraseñas «Verano2026!» y «Empresa123». No se ha bloqueado ninguna cuenta. ¿Qué ataque es?","opciones":["Fuerza bruta (brute force)","Ataque de cumpleaños (birthday attack)","Repetición (replay)","Rociado de contraseñas (password spraying)"],"correcta":3,"explicacion":"Pocas contraseñas comunes contra muchas cuentas, evitando los bloqueos, es password spraying. La fuerza bruta prueba muchas contraseñas contra una cuenta; el ataque de cumpleaños busca colisiones de hash; el replay reutiliza tráfico capturado."},{"id":"D2-031","dominio":2,"objetivo":"2.4","enunciado":"Un usuario inicia sesión en el correo corporativo desde Madrid y, 12 minutos después, desde Singapur. ¿Qué indicador de actividad maliciosa es?","opciones":["Viaje imposible (impossible travel)","Bloqueo de cuenta (account lockout)","Registros desaparecidos (missing logs)","Consumo de recursos (resource consumption)"],"correcta":0,"explicacion":"Dos accesos desde ubicaciones físicamente incompatibles en poco tiempo son viaje imposible, indicio de credenciales robadas. No hay bloqueos, logs ausentes ni consumo anómalo de recursos."},{"id":"D2-032","dominio":2,"objetivo":"2.4","enunciado":"En los logs de un servidor web aparece la petición «GET /descargas?archivo=../../../../etc/passwd». ¿Qué ataque se intentó?","opciones":["Cross-site scripting (XSS)","Inyección SQL","Recorrido de directorios (directory traversal)","Falsificación de petición (CSRF)"],"correcta":2,"explicacion":"La secuencia «../» para salir del directorio permitido es directory traversal. XSS usaría etiquetas <script>, SQLi usaría sintaxis SQL como ' OR 1=1 y CSRF fuerza peticiones desde la sesión de la víctima."},{"id":"D2-033","dominio":2,"objetivo":"2.4","enunciado":"Un formulario de login recibe como usuario el valor «admin' OR '1'='1' --». ¿Qué ataque es?","opciones":["Inyección SQL (SQL injection)","Directory traversal","Desbordamiento de búfer","Ataque de degradación (downgrade)"],"correcta":0,"explicacion":"Las comillas y la condición siempre verdadera manipulan la consulta SQL. No hay rutas «../», no se desborda memoria y no se fuerza un protocolo más débil."},{"id":"D2-034","dominio":2,"objetivo":"2.4","enunciado":"Un atacante en la misma red Wi-Fi pública intercepta y modifica el tráfico entre un cliente y su banco. ¿Qué tipo de ataque es?","opciones":["Ataque de amplificación DNS","Rociado de contraseñas","Bomba lógica","Ataque en ruta (on-path)"],"correcta":3,"explicacion":"Situarse entre las dos partes para interceptar o modificar el tráfico es un ataque on-path (antes MITM). La amplificación DNS es DDoS; el spraying ataca contraseñas; la bomba lógica es malware condicional."},{"id":"D2-035","dominio":2,"objetivo":"2.4","enunciado":"Un atacante envía pequeñas consultas DNS con la IP de origen falsificada de la víctima a muchos resolvers abiertos, que responden con paquetes mucho mayores hacia la víctima. ¿Qué ataque es?","opciones":["DDoS amplificado/reflejado (amplified/reflected)","Envenenamiento de caché ARP","Directory traversal","Ataque de colisión"],"correcta":0,"explicacion":"Usar servidores de terceros que responden con más datos hacia la IP falsificada es un DDoS de amplificación/reflejo. ARP poisoning afecta a la red local; directory traversal es web; la colisión es criptográfica."},{"id":"D2-036","dominio":2,"objetivo":"2.4","enunciado":"Durante una conexión, un atacante manipula la negociación para que cliente y servidor usen SSL 3.0 en lugar de TLS 1.3. ¿Qué ataque es?","opciones":["Ataque de cumpleaños (birthday)","Repetición de credenciales (credential replay)","Rociado de contraseñas","Ataque de degradación (downgrade)"],"correcta":3,"explicacion":"Forzar una versión de protocolo más débil es un downgrade attack. El ataque de cumpleaños busca colisiones de hash; el replay reutiliza credenciales capturadas; el spraying prueba contraseñas."},{"id":"D2-037","dominio":2,"objetivo":"2.4","enunciado":"Un atacante captura el hash NTLM de un administrador y lo usa directamente para autenticarse en otros servidores sin conocer la contraseña. ¿Qué tipo de ataque es?","opciones":["Fuerza bruta","Repetición de credenciales (credential replay / pass-the-hash)","Ataque de cumpleaños","Typosquatting"],"correcta":1,"explicacion":"Reutilizar un hash capturado para autenticarse es credential replay (pass-the-hash). No se prueba ninguna contraseña (fuerza bruta), no se buscan colisiones y no intervienen dominios."},{"id":"D2-038","dominio":2,"objetivo":"2.4","enunciado":"Un ladrón usa un lector oculto para copiar la tarjeta de proximidad de un empleado en la cafetería y luego entra en el edificio con una copia. ¿Qué ataque es?","opciones":["Evil twin","Bluesnarfing","Clonación RFID (RFID cloning)","Watering hole"],"correcta":2,"explicacion":"Copiar una tarjeta de proximidad es clonación RFID, un ataque físico. Evil twin es un punto de acceso Wi-Fi falso, bluesnarfing roba datos por Bluetooth y watering hole infecta sitios web."},{"id":"D2-039","dominio":2,"objetivo":"2.4","enunciado":"Tras un incidente, el analista descubre que los registros de seguridad del servidor tienen un hueco de 3 horas justo cuando ocurrió el acceso sospechoso. ¿Qué indicador es?","opciones":["Viaje imposible","Bloqueo de cuenta","Registros desaparecidos (missing logs)","Contenido publicado (published content)"],"correcta":2,"explicacion":"Huecos en los logs suelen indicar que el atacante los borró para ocultar su actividad. El viaje imposible es geográfico, el bloqueo de cuenta se produce por intentos fallidos y el contenido publicado se refiere a datos filtrados."},{"id":"D2-040","dominio":2,"objetivo":"2.5","enunciado":"Una empresa quiere asegurarse de que en los puestos de contabilidad solo se ejecuten las cinco aplicaciones aprobadas. ¿Qué técnica de mitigación es la más adecuada?","opciones":["Lista de bloqueo de aplicaciones (deny list)","Segmentación de red","Lista de aplicaciones permitidas (application allow list)","Honeypot"],"correcta":2,"explicacion":"Una allow list solo permite lo aprobado y bloquea todo lo demás, incluido malware desconocido. Una deny list solo bloquea lo que ya se conoce como malo; la segmentación limita la red, no las aplicaciones; un honeypot es un señuelo."},{"id":"D2-041","dominio":2,"objetivo":"2.5","enunciado":"Un EDR detecta ransomware activo en un portátil. ¿Cuál es la primera mitigación más adecuada para evitar la propagación?","opciones":["Aplicar la última actualización del navegador","Cambiar la política de contraseñas","Desmantelar (decommission) todos los servidores","Aislar (isolation) el equipo de la red"],"correcta":3,"explicacion":"Aislar el equipo comprometido contiene el incidente y evita la propagación. Actualizar el navegador o la política de contraseñas no detiene el ransomware activo, y desmantelar todos los servidores es desproporcionado."},{"id":"D2-042","dominio":2,"objetivo":"2.5","enunciado":"Tras una auditoría se detecta que todos los empleados tienen permisos de administrador local en sus equipos. ¿Qué principio de mitigación debe aplicarse?","opciones":["Fail-open","Desmantelamiento (decommissioning)","Seguridad por oscuridad","Mínimo privilegio (least privilege)"],"correcta":3,"explicacion":"Conceder solo los permisos necesarios es el principio de mínimo privilegio. Fail-open es un modo de fallo, el desmantelamiento retira activos y la seguridad por oscuridad no es una mitigación válida."},{"id":"D2-043","dominio":2,"objetivo":"2.5","enunciado":"Un equipo de seguridad quiere limitar el movimiento lateral entre la red de los cajeros, la red de oficinas y la red de invitados. ¿Qué técnica es la más adecuada?","opciones":["Segmentación de red (VLAN y reglas de firewall entre segmentos)","Cifrado de disco completo","Deshabilitar el Bluetooth","Hashing de contraseñas"],"correcta":0,"explicacion":"Separar la red en segmentos con controles entre ellos limita el movimiento lateral. El cifrado de disco protege datos en reposo; deshabilitar Bluetooth y hashear contraseñas no separan redes."},{"id":"D2-044","dominio":2,"objetivo":"2.5","enunciado":"Un servidor recién instalado tiene activos servicios como Telnet, FTP y un servidor de impresión que no se usan. ¿Qué técnica de bastionado (hardening) se debe aplicar?","opciones":["Instalar un honeypot en el servidor","Deshabilitar puertos, protocolos y servicios innecesarios","Activar fail-open en el firewall","Aumentar el tamaño del disco"],"correcta":1,"explicacion":"Reducir la superficie de ataque deshabilitando servicios no usados es una técnica básica de hardening. Un honeypot en un servidor de producción no tiene sentido, fail-open reduce la seguridad y el tamaño del disco es irrelevante."},{"id":"D3-001","dominio":3,"objetivo":"3.1","enunciado":"Una empresa usa un CRM en modalidad SaaS. Se produce una fuga porque un empleado compartió su contraseña y no había MFA activado. Según el modelo de responsabilidad compartida, ¿quién era responsable de ese control?","opciones":["El proveedor SaaS, porque gestiona toda la aplicación","El cliente, porque la gestión de identidades y accesos es suya","El proveedor del centro de datos físico","Nadie, porque en SaaS no hay responsabilidad compartida"],"correcta":1,"explicacion":"En todos los modelos (incluido SaaS) los datos y la gestión de accesos de los usuarios son responsabilidad del cliente. El proveedor gestiona la aplicación y la infraestructura, pero no decide quién accede ni cómo protege sus credenciales."},{"id":"D3-002","dominio":3,"objetivo":"3.1","enunciado":"Un equipo DevOps define sus servidores, redes y reglas de firewall en archivos de plantilla versionados en Git que se despliegan automáticamente. ¿Qué concepto describe?","opciones":["Arquitectura sin servidor (serverless)","Infraestructura como código (IaC)","Red definida por software (SDN)","Air gap"],"correcta":1,"explicacion":"Definir la infraestructura en código versionado es IaC: repetible y auditable, aunque un error se replica en todos los despliegues. Serverless delega la infraestructura al proveedor; SDN separa planos de red; air gap es aislamiento físico."},{"id":"D3-003","dominio":3,"objetivo":"3.1","enunciado":"Una central eléctrica mantiene su red de control totalmente desconectada de cualquier otra red. ¿Cuál es el principal vector de riesgo que persiste?","opciones":["Ataques DDoS desde internet","Medios extraíbles como USB usados para transferir datos o actualizaciones","Phishing por correo dirigido a los PLC","Vulnerabilidades en el proveedor SaaS"],"correcta":1,"explicacion":"En una red aislada físicamente (air-gapped) el riesgo principal son los medios extraíbles que cruzan el aislamiento. Al no tener conexión, no hay DDoS desde internet, correo ni dependencia de SaaS."},{"id":"D3-004","dominio":3,"objetivo":"3.1","enunciado":"¿Cuál es la principal diferencia de seguridad entre contenedores y máquinas virtuales?","opciones":["Los contenedores tienen cada uno su propio kernel y hardware virtual","Las máquinas virtuales no pueden sufrir ningún tipo de escape","Los contenedores no pueden ejecutarse en la nube","Los contenedores comparten el kernel del sistema anfitrión, por lo que el aislamiento es menor que en una VM"],"correcta":3,"explicacion":"Los contenedores comparten el kernel del host; una vulnerabilidad en él afecta a todos. Las VM tienen kernel propio sobre un hipervisor, aunque pueden sufrir VM escape. Los contenedores se usan ampliamente en la nube."},{"id":"D3-005","dominio":3,"objetivo":"3.1","enunciado":"Una ciudad despliega miles de sensores IoT de tráfico con poca memoria y CPU. ¿Cuál es una preocupación de seguridad típica de estos dispositivos?","opciones":["Capacidad limitada para parches y cifrado fuerte, y credenciales por defecto","Exceso de potencia de cálculo que facilita la minería de criptomonedas","Imposibilidad de conectarse a internet","Que siempre ejecutan un sistema operativo de escritorio completo"],"correcta":0,"explicacion":"Los IoT suelen tener recursos limitados, actualizaciones difíciles y contraseñas de fábrica. No tienen exceso de potencia, sí se conectan a la red y no suelen ejecutar sistemas de escritorio."},{"id":"D3-006","dominio":3,"objetivo":"3.1","enunciado":"Una aplicación monolítica se reescribe como microservicios que se comunican por API. ¿Qué implicación de seguridad es correcta?","opciones":["Desaparece la necesidad de autenticar las llamadas entre servicios","Se elimina la superficie de ataque al no haber servidor","Se convierte automáticamente en una red air-gapped","Aumenta la superficie de ataque (más APIs que proteger), aunque un fallo puede quedar aislado en un servicio"],"correcta":3,"explicacion":"Más servicios y APIs implican más puntos de entrada que asegurar y autenticar, aunque mejoran el aislamiento de fallos. Las llamadas internas deben autenticarse; los microservicios no eliminan servidores ni equivalen a aislamiento físico."},{"id":"D3-007","dominio":3,"objetivo":"3.1","enunciado":"Un proveedor de cloud gestiona el sistema operativo, el runtime y el escalado; el cliente solo sube su código y sus datos. ¿Qué modelo de servicio es?","opciones":["PaaS (Platform as a Service)","IaaS (Infrastructure as a Service)","SaaS (Software as a Service)","On-premises"],"correcta":0,"explicacion":"En PaaS el proveedor gestiona la plataforma (SO, runtime) y el cliente su aplicación y datos. En IaaS el cliente gestiona también el SO; en SaaS solo usa la aplicación; on-premises lo gestiona todo el cliente."},{"id":"D3-008","dominio":3,"objetivo":"3.1","enunciado":"Un sistema que controla los frenos de un tren debe responder en milisegundos garantizados. ¿Qué tipo de sistema es y qué reto de seguridad presenta?","opciones":["Un SaaS, cuya seguridad gestiona totalmente el proveedor","Un contenedor, que comparte kernel con otros servicios web","Un RTOS (sistema operativo en tiempo real), difícil de parchear sin afectar a la temporización","Un honeypot, diseñado para atraer atacantes"],"correcta":2,"explicacion":"Los RTOS garantizan tiempos de respuesta y suelen ser embebidos y difíciles de actualizar. No es un SaaS, un contenedor web ni un señuelo."},{"id":"D3-009","dominio":3,"objetivo":"3.2","enunciado":"Un firewall perimetral de un banco falla. La política exige que, en caso de fallo, no pase ningún tráfico aunque se interrumpa el servicio. ¿Qué modo de fallo debe configurarse?","opciones":["Fail-open","Activo-activo","Fail-closed","Modo pasivo (tap)"],"correcta":2,"explicacion":"Fail-closed bloquea todo el tráfico ante un fallo, priorizando la seguridad. Fail-open deja pasar el tráfico priorizando la disponibilidad; activo-activo es una configuración de balanceo; tap es una conexión pasiva de monitorización."},{"id":"D3-010","dominio":3,"objetivo":"3.2","enunciado":"Los administradores deben acceder a los servidores de la red de producción. Para no exponerlos directamente, todo el acceso pasa por un único servidor endurecido y monitorizado. ¿Qué es ese servidor?","opciones":["Proxy directo (forward proxy)","Balanceador de carga","Honeypot","Servidor de salto (jump server)"],"correcta":3,"explicacion":"Un jump server (bastión) es el punto de entrada controlado para administrar una zona segura. Un forward proxy media la navegación de los clientes; un balanceador reparte tráfico; un honeypot es un señuelo."},{"id":"D3-011","dominio":3,"objetivo":"3.2","enunciado":"Una tienda online sufre intentos de inyección SQL y XSS contra su web pública. ¿Qué dispositivo protege mejor la aplicación?","opciones":["Firewall de capa 4 que filtra por IP y puerto","Firewall de aplicaciones web (WAF)","Switch con VLANs","SAI (UPS)"],"correcta":1,"explicacion":"El WAF inspecciona tráfico HTTP en capa 7 y bloquea patrones como SQLi o XSS. Un firewall de capa 4 no ve el contenido; las VLAN segmentan la red; un UPS proporciona energía."},{"id":"D3-012","dominio":3,"objetivo":"3.2","enunciado":"Un equipo quiere un sistema que analice el tráfico y bloquee automáticamente ataques conocidos en tiempo real. ¿Cómo debe desplegarse?","opciones":["Un IPS en línea (inline)","Un IDS conectado a un puerto espejo (SPAN)","Un honeypot en la DMZ","Un servidor de salto"],"correcta":0,"explicacion":"Para bloquear, el IPS debe estar en línea, en el camino del tráfico. Un IDS en un puerto espejo solo detecta; un honeypot atrae atacantes y un jump server sirve para administrar."},{"id":"D3-013","dominio":3,"objetivo":"3.2","enunciado":"Una empresa publica su servidor web y su servidor de correo en internet, pero quiere separarlos de la red interna. ¿Dónde debe situarlos?","opciones":["En la VLAN de recursos humanos","En la red interna junto a los controladores de dominio","En una subred filtrada (screened subnet / DMZ)","En una red air-gapped"],"correcta":2,"explicacion":"La DMZ alberga servicios públicos separados de la red interna mediante firewalls. Situarlos en redes internas expone sistemas críticos y una red air-gapped no sería accesible desde internet."},{"id":"D3-014","dominio":3,"objetivo":"3.2","enunciado":"Antes de que un portátil acceda a la red cableada de la oficina, el switch exige que se autentique con un certificado contra un servidor RADIUS. ¿Qué tecnología se usa?","opciones":["SD-WAN","NetFlow","802.1X con EAP","SNMPv1"],"correcta":2,"explicacion":"802.1X es el control de acceso por puerto que usa EAP y un servidor RADIUS. SD-WAN gestiona enlaces WAN; NetFlow registra flujos; SNMPv1 gestiona dispositivos y es inseguro."},{"id":"D3-015","dominio":3,"objetivo":"3.2","enunciado":"Una empresa con muchos teletrabajadores y sucursales quiere ofrecer conectividad y seguridad (SWG, CASB, ZTNA, firewall) como un servicio unificado desde la nube. ¿Qué concepto describe?","opciones":["SASE (Secure Access Service Edge)","UTM local en cada sucursal","Red air-gapped","VLAN de invitados"],"correcta":0,"explicacion":"SASE combina funciones de red (SD-WAN) y de seguridad entregadas desde la nube. Un UTM local no es un servicio en la nube; una red air-gapped no tiene conectividad; una VLAN de invitados solo segmenta."},{"id":"D3-016","dominio":3,"objetivo":"3.2","enunciado":"Una pyme quiere un único dispositivo que combine firewall, antivirus de pasarela, filtrado de contenido y VPN para simplificar la gestión. ¿Qué dispositivo es?","opciones":["UTM (Unified Threat Management)","WAF","Jump server","Sensor pasivo"],"correcta":0,"explicacion":"Un UTM integra varias funciones de seguridad en un solo equipo. Un WAF solo protege aplicaciones web; un jump server sirve para administrar; un sensor pasivo solo recoge datos."},{"id":"D3-017","dominio":3,"objetivo":"3.2","enunciado":"Un servidor web interno debe quedar oculto a internet; las peticiones externas llegan a un intermediario que las reenvía, termina TLS y filtra el tráfico. ¿Qué es ese intermediario?","opciones":["Proxy directo (forward proxy)","Servidor RADIUS","Concentrador de VPN de cliente","Proxy inverso (reverse proxy)"],"correcta":3,"explicacion":"Un proxy inverso recibe peticiones en nombre de los servidores internos. Un proxy directo actúa en nombre de los clientes internos que salen a internet; RADIUS autentica; un concentrador VPN da acceso remoto a usuarios."},{"id":"D3-018","dominio":3,"objetivo":"3.2","enunciado":"Se instala un IDS conectado a un TAP de red para no introducir latencia ni ser un punto de fallo. ¿Qué limitación tiene este despliegue?","opciones":["Introduce un punto único de fallo en la red","Descifra automáticamente todo el tráfico TLS","No puede bloquear el tráfico malicioso, solo detectarlo y alertar","Reemplaza al firewall perimetral"],"correcta":2,"explicacion":"Un dispositivo pasivo recibe una copia del tráfico, así que solo detecta. Al no estar en línea no es un punto de fallo, no descifra TLS por sí mismo y no sustituye al firewall."},{"id":"D3-019","dominio":3,"objetivo":"3.3","enunciado":"Una aseguradora debe garantizar que los datos de clientes europeos se almacenen únicamente en centros de datos de la UE para cumplir la ley. ¿Qué concepto aplica?","opciones":["Soberanía de datos (data sovereignty)","Tokenización","Ofuscación","Disponibilidad"],"correcta":0,"explicacion":"Los datos están sujetos a las leyes del país donde se almacenan: soberanía de datos. La tokenización y la ofuscación protegen el contenido, no la ubicación; la disponibilidad es acceso cuando se necesita."},{"id":"D3-020","dominio":3,"objetivo":"3.3","enunciado":"Un centro de atención al cliente necesita ver solo los cuatro últimos dígitos de la tarjeta de los clientes («**** **** **** 4821»). ¿Qué técnica se aplica?","opciones":["Hashing","Cifrado asimétrico","Enmascaramiento de datos (data masking)","Esteganografía"],"correcta":2,"explicacion":"Mostrar solo parte del dato y ocultar el resto es enmascaramiento. El hashing genera un resumen irreconocible; el cifrado asimétrico protege el dato completo; la esteganografía oculta datos dentro de otros archivos."},{"id":"D3-021","dominio":3,"objetivo":"3.3","enunciado":"Un servidor de base de datos procesa información cifrada y la empresa quiere protegerla mientras está cargada en la memoria del procesador. ¿Qué estado de los datos se está protegiendo?","opciones":["Datos en reposo (at rest)","Datos en tránsito (in transit)","Datos archivados","Datos en uso (in use)"],"correcta":3,"explicacion":"Los datos en memoria o siendo procesados están en uso; se protegen con enclaves seguros o cifrado homomórfico. En reposo están almacenados; en tránsito viajan por la red; archivados es una forma de reposo."},{"id":"D3-022","dominio":3,"objetivo":"3.3","enunciado":"Una empresa quiere proteger los datos que viajan entre sus sucursales por internet. ¿Qué control es el más adecuado?","opciones":["Cifrado de disco completo en los servidores","Un túnel VPN IPsec entre sedes","Enmascaramiento de datos en la base de datos","Restricción de permisos NTFS"],"correcta":1,"explicacion":"Los datos en tránsito se protegen con cifrado del canal (IPsec, TLS). El cifrado de disco protege datos en reposo; el enmascaramiento y los permisos no cifran la comunicación."},{"id":"D3-023","dominio":3,"objetivo":"3.3","enunciado":"Los planos de un nuevo producto que aún no se ha anunciado y que dan ventaja competitiva a la empresa son un ejemplo de qué tipo de dato?","opciones":["Dato público","Dato regulado por normativa de salud","Secreto comercial / propiedad intelectual","Dato de registro de auditoría"],"correcta":2,"explicacion":"La información confidencial que da ventaja competitiva es secreto comercial o propiedad intelectual. No es pública, no es un dato sanitario regulado ni un log de auditoría."},{"id":"D3-024","dominio":3,"objetivo":"3.3","enunciado":"Un banco bloquea cualquier intento de acceso a su portal de administración desde direcciones IP de fuera del país. ¿Qué método de protección de datos usa?","opciones":["Tokenización","Restricciones geográficas (geographic restrictions)","Hashing","Esteganografía"],"correcta":1,"explicacion":"Limitar el acceso según la ubicación es una restricción geográfica (geolocalización). La tokenización sustituye datos; el hashing comprueba integridad; la esteganografía oculta información."},{"id":"D3-025","dominio":3,"objetivo":"3.3","enunciado":"Una organización etiqueta sus documentos como «Pública», «Interna», «Confidencial» y «Restringida» para aplicar controles distintos a cada nivel. ¿Qué está haciendo?","opciones":["Soberanía de datos","Ofuscación","Segmentación de red","Clasificación de datos (data classification)"],"correcta":3,"explicacion":"Asignar niveles de sensibilidad para aplicar controles proporcionados es clasificación de datos. La soberanía se refiere a leyes por ubicación; la ofuscación oculta datos; la segmentación separa redes."},{"id":"D3-026","dominio":3,"objetivo":"3.3","enunciado":"Para verificar que una copia de un archivo de evidencias es idéntica al original, un analista compara un valor calculado sobre ambos. ¿Qué método usa?","opciones":["Enmascaramiento","Hashing (por ejemplo SHA-256)","Tokenización","Restricciones geográficas"],"correcta":1,"explicacion":"Calcular y comparar hashes verifica que los datos son idénticos (integridad). El enmascaramiento y la tokenización ocultan o sustituyen datos; las restricciones geográficas controlan el acceso."},{"id":"D3-027","dominio":3,"objetivo":"3.4","enunciado":"Un servidor de archivos usa 4 discos en RAID 5. Falla un disco. ¿Qué ocurre?","opciones":["Se pierden todos los datos inmediatamente","El RAID 5 no tolera ningún fallo de disco","Solo se conservan los datos del disco que falló","Los datos siguen disponibles gracias a la paridad distribuida y el disco puede reconstruirse"],"correcta":3,"explicacion":"RAID 5 tolera el fallo de un disco gracias a la paridad distribuida; si fallara un segundo antes de reconstruir, se perderían los datos. No es RAID 0, que no tiene redundancia."},{"id":"D3-028","dominio":3,"objetivo":"3.4","enunciado":"Un editor de vídeo quiere el máximo rendimiento de lectura/escritura con dos discos y acepta perder los datos si falla uno, porque tiene copias en otro lugar. ¿Qué nivel de RAID elige?","opciones":["RAID 1","RAID 5","RAID 6","RAID 0"],"correcta":3,"explicacion":"RAID 0 (striping) ofrece rendimiento sin redundancia. RAID 1 es espejo (redundante); RAID 5 y 6 usan paridad y necesitan al menos 3 y 4 discos respectivamente."},{"id":"D3-029","dominio":3,"objetivo":"3.4","enunciado":"Una empresa hace una copia completa el domingo y copias diferenciales de lunes a sábado. El viernes por la tarde falla el servidor. ¿Qué copias necesita para restaurar?","opciones":["La copia completa y todas las diferenciales de lunes a jueves","Solo la última diferencial","Solo la copia completa","La copia completa del domingo y la diferencial del jueves (la última)"],"correcta":3,"explicacion":"Cada diferencial contiene todos los cambios desde la última completa, así que basta la completa más la última diferencial. Restaurar todas sería el procedimiento de las incrementales; la diferencial sola no tiene la base; la completa sola pierde los cambios de la semana."},{"id":"D3-030","dominio":3,"objetivo":"3.4","enunciado":"Un hospital necesita que, si su centro de datos principal se destruye, los sistemas críticos funcionen en otro lugar en menos de 1 hora, con datos casi en tiempo real. ¿Qué tipo de sitio necesita?","opciones":["Sitio frío (cold site)","Sitio templado (warm site)","Sitio caliente (hot site)","Copia en cinta almacenada en la sede principal"],"correcta":2,"explicacion":"Un hot site está totalmente equipado y sincronizado, y permite recuperarse en minutos u horas. Un cold site solo tiene espacio y energía (días/semanas); un warm site necesita horas o días; una cinta en la misma sede se destruiría con ella."},{"id":"D3-031","dominio":3,"objetivo":"3.4","enunciado":"Durante un apagón, los servidores deben seguir funcionando sin interrupción durante los 30 segundos que tarda en arrancar el generador. ¿Qué elemento lo garantiza?","opciones":["Una PDU sin batería","Un SAI (UPS)","Un segundo balanceador de carga","Un sitio frío"],"correcta":1,"explicacion":"El UPS proporciona energía inmediata y de corta duración hasta que arranca el generador. Una PDU solo distribuye energía; un balanceador no aporta energía; un sitio frío no evita la interrupción."},{"id":"D3-032","dominio":3,"objetivo":"3.4","enunciado":"El equipo de continuidad reúne a los responsables en una sala para recorrer verbalmente cómo responderían a una inundación, sin tocar ningún sistema. ¿Qué tipo de prueba es?","opciones":["Prueba de conmutación (failover)","Ejercicio de mesa (tabletop exercise)","Procesamiento paralelo (parallel processing)","Prueba de penetración"],"correcta":1,"explicacion":"Discutir el escenario sin ejecutar acciones reales es un tabletop. Failover cambia realmente al sistema secundario; el procesamiento paralelo ejecuta ambos sistemas a la vez; un pentest evalúa vulnerabilidades."},{"id":"D3-033","dominio":3,"objetivo":"3.4","enunciado":"¿Qué estrategia de copias ofrece la copia diaria más rápida, aunque la restauración sea más lenta porque requiere la última completa y todas las copias posteriores?","opciones":["Incremental","Diferencial","Completa diaria","Snapshot único mensual"],"correcta":0,"explicacion":"La incremental solo copia cambios desde la última copia de cualquier tipo: rápida de hacer, lenta de restaurar. La diferencial crece cada día; la completa diaria es la más lenta de hacer; un snapshot mensual no cubre los cambios diarios."},{"id":"D3-034","dominio":3,"objetivo":"3.4","enunciado":"Una empresa distribuye sus cargas entre dos proveedores de nube distintos para no depender de uno solo si sufre una caída global. ¿Qué concepto aplica?","opciones":["Multinube (multi-cloud) / diversidad de plataformas","Air gap","Tokenización","Fail-open"],"correcta":0,"explicacion":"Usar varios proveedores evita un punto único de fallo y la dependencia de un proveedor. Air gap es aislamiento físico; la tokenización protege datos; fail-open es un modo de fallo."},{"id":"D3-035","dominio":3,"objetivo":"3.4","enunciado":"Un servidor de base de datos necesita tolerar el fallo simultáneo de dos discos. ¿Qué RAID es el adecuado con el menor coste en discos?","opciones":["RAID 5","RAID 0","RAID 6","RAID 1 con dos discos"],"correcta":2,"explicacion":"RAID 6 usa doble paridad y tolera dos fallos con un mínimo de 4 discos. RAID 5 solo tolera uno, RAID 0 ninguno y un RAID 1 de dos discos solo tolera uno."},{"id":"D3-036","dominio":3,"objetivo":"3.4","enunciado":"Dos servidores de aplicaciones atienden tráfico simultáneamente y, si uno cae, el otro asume toda la carga. ¿Qué configuración de alta disponibilidad es?","opciones":["Balanceo de carga activo-activo","Sitio frío","Copia de seguridad diferencial","Fail-closed"],"correcta":0,"explicacion":"En activo-activo ambos nodos atienden tráfico y se cubren mutuamente. Un sitio frío requiere días; una copia diferencial no da disponibilidad inmediata; fail-closed es un modo de fallo de seguridad."},{"id":"D4-001","dominio":4,"objetivo":"4.1","enunciado":"Una empresa configura una red Wi-Fi nueva y quiere el protocolo más seguro, que sustituya la clave precompartida por un intercambio resistente a ataques de diccionario offline. ¿Qué debe usar?","opciones":["WPA2-PSK con TKIP","WEP con clave de 128 bits","WPS con PIN","WPA3 con SAE"],"correcta":3,"explicacion":"WPA3 usa SAE (Simultaneous Authentication of Equals), resistente a ataques de diccionario offline. WPA2-PSK con TKIP es débil; WEP está roto; WPS con PIN es vulnerable a fuerza bruta."},{"id":"D4-002","dominio":4,"objetivo":"4.1","enunciado":"Antes de instalar los puntos de acceso de una nueva planta, un técnico recorre el edificio midiendo la señal e interferencias para generar un mapa de calor. ¿Qué actividad realiza?","opciones":["Prueba de penetración física","Análisis de causa raíz","Ejercicio de mesa","Estudio de sitio (site survey)"],"correcta":3,"explicacion":"Medir cobertura e interferencias para ubicar APs es un site survey, que produce un heat map. Las otras actividades no tienen relación con la planificación inalámbrica."},{"id":"D4-003","dominio":4,"objetivo":"4.1","enunciado":"Una empresa permite que los empleados usen su teléfono personal para el correo corporativo, pero quiere poder borrar solo los datos de la empresa si el empleado se va. ¿Qué combinación es más adecuada?","opciones":["BYOD con MDM/MAM y contenedorización de los datos corporativos","COPE sin ninguna gestión","CYOD con borrado completo del dispositivo","Prohibir el correo en móviles y usar fax"],"correcta":0,"explicacion":"En BYOD el dispositivo es del empleado; la contenedorización con MDM/MAM permite separar y borrar solo los datos corporativos. COPE y CYOD son dispositivos de la empresa; borrar todo un dispositivo personal sería invasivo."},{"id":"D4-004","dominio":4,"objetivo":"4.1","enunciado":"Un desarrollador quiere garantizar que los usuarios sepan que su aplicación procede realmente de su empresa y no ha sido modificada. ¿Qué técnica debe usar?","opciones":["Sandboxing","Firma de código (code signing)","Validación de entradas","Análisis estático"],"correcta":1,"explicacion":"La firma de código prueba el origen y la integridad del software. El sandboxing aísla la ejecución; la validación de entradas evita inyecciones; el análisis estático revisa código fuente."},{"id":"D4-005","dominio":4,"objetivo":"4.1","enunciado":"Un formulario web acepta solo números en el campo «edad» y rechaza cualquier otro carácter en el servidor. ¿Qué técnica de seguridad de aplicaciones se aplica?","opciones":["Firma de código","Cookies seguras","Validación de entradas (input validation)","Sandboxing"],"correcta":2,"explicacion":"Comprobar que la entrada cumple el formato esperado es validación de entradas, clave contra inyecciones. La firma de código verifica el origen; las cookies seguras protegen sesiones; el sandboxing aísla la ejecución."},{"id":"D4-006","dominio":4,"objetivo":"4.1","enunciado":"Un equipo de TI aplica a todos los servidores Windows una configuración estándar basada en los CIS Benchmarks y comprueba periódicamente que no se desvían de ella. ¿Qué concepto describe?","opciones":["Análisis de impacto en el negocio","Línea base segura (secure baseline)","Gestión de parches de terceros","Honeynet"],"correcta":1,"explicacion":"Una configuración de referencia que se establece, despliega y mantiene es una secure baseline. El BIA analiza impacto de interrupciones; los parches son otro proceso; una honeynet es una red señuelo."},{"id":"D4-007","dominio":4,"objetivo":"4.1","enunciado":"Un analista ejecuta un archivo adjunto sospechoso en un entorno aislado y controlado para observar su comportamiento sin riesgo para la red. ¿Qué técnica usa?","opciones":["Sandboxing","Firma de código","Geofencing","Tokenización"],"correcta":0,"explicacion":"El sandboxing ejecuta código en un entorno aislado. La firma de código verifica el origen; el geofencing usa la ubicación; la tokenización sustituye datos."},{"id":"D4-008","dominio":4,"objetivo":"4.2","enunciado":"Una empresa va a donar 200 portátiles con discos SSD. Quiere asegurarse de que los datos no se puedan recuperar y que los equipos sigan funcionando. ¿Qué método es el más adecuado?","opciones":["Desmagnetización (degaussing)","Borrado criptográfico (crypto erase) o borrado seguro del fabricante","Trituración física de los discos","Formateo rápido del sistema operativo"],"correcta":1,"explicacion":"En SSD, destruir la clave de cifrado o usar el borrado seguro del fabricante deja el disco reutilizable y sin datos recuperables. La desmagnetización no funciona en SSD; triturar impediría la donación; el formateo rápido deja los datos recuperables."},{"id":"D4-009","dominio":4,"objetivo":"4.2","enunciado":"Un proveedor externo destruye los discos duros de una empresa. ¿Qué documento debe exigir la empresa como prueba?","opciones":["Certificado de destrucción (certificate of destruction)","Acuerdo de nivel de servicio (SLA)","Lista de revocación de certificados (CRL)","Política de uso aceptable (AUP)"],"correcta":0,"explicacion":"El certificado de destrucción documenta qué se destruyó, cuándo y cómo. El SLA define niveles de servicio, la CRL lista certificados revocados y la AUP regula el uso de recursos."},{"id":"D4-010","dominio":4,"objetivo":"4.2","enunciado":"Durante una auditoría se descubren 15 servidores que no figuran en ningún registro y cuyo responsable nadie conoce. ¿Qué proceso ha fallado?","opciones":["Gestión de claves criptográficas","Respuesta a incidentes","Inventario y asignación de propietarios de activos (asset management)","Filtrado DNS"],"correcta":2,"explicacion":"Los activos deben inventariarse y tener un propietario asignado desde su adquisición. La gestión de claves, la respuesta a incidentes o el filtrado DNS no tratan del registro de activos."},{"id":"D4-011","dominio":4,"objetivo":"4.2","enunciado":"Una política exige conservar los registros financieros 7 años y eliminarlos de forma segura después. ¿Qué concepto de gestión de datos aplica?","opciones":["Clasificación de datos","Retención de datos (data retention)","Soberanía de datos","Tokenización"],"correcta":1,"explicacion":"Definir cuánto tiempo se conservan los datos y cuándo se eliminan es retención de datos. La clasificación asigna sensibilidad; la soberanía depende de la ubicación; la tokenización sustituye datos."},{"id":"D4-012","dominio":4,"objetivo":"4.2","enunciado":"Unas cintas magnéticas de copia antiguas deben inutilizarse por completo; no se reutilizarán. ¿Qué método es adecuado y eficaz?","opciones":["Desmagnetización (degaussing) seguida de destrucción física","Borrado criptográfico sin cifrado previo","Renombrar los archivos","Formateo rápido"],"correcta":0,"explicacion":"La desmagnetización es eficaz en medios magnéticos como las cintas, y la destrucción física lo garantiza. El borrado criptográfico solo funciona si los datos estaban cifrados; renombrar o formatear no elimina datos."},{"id":"D4-013","dominio":4,"objetivo":"4.3","enunciado":"Un escáner de vulnerabilidades informa de una vulnerabilidad de Apache en un servidor que en realidad ejecuta Nginx. ¿Qué es este resultado?","opciones":["Falso positivo (false positive)","Falso negativo (false negative)","Verdadero positivo (true positive)","Verdadero negativo (true negative)"],"correcta":0,"explicacion":"Un aviso de algo que no existe es un falso positivo. Un falso negativo sería no detectar una vulnerabilidad real; un verdadero positivo sería un hallazgo correcto; un verdadero negativo, la ausencia correcta de alerta."},{"id":"D4-014","dominio":4,"objetivo":"4.3","enunciado":"Un analista debe priorizar 300 vulnerabilidades. ¿Qué sistema estándar proporciona una puntuación de gravedad de 0 a 10?","opciones":["CVE (Common Vulnerabilities and Exposures)","SCAP","CVSS (Common Vulnerability Scoring System)","SOAR"],"correcta":2,"explicacion":"CVSS puntúa la gravedad de 0 a 10. CVE es el identificador único de cada vulnerabilidad; SCAP automatiza evaluaciones de configuración; SOAR orquesta respuestas."},{"id":"D4-015","dominio":4,"objetivo":"4.3","enunciado":"Tras aplicar un parche crítico, el equipo vuelve a ejecutar el escáner para confirmar que la vulnerabilidad ha desaparecido. ¿Qué fase de la gestión de vulnerabilidades es?","opciones":["Identificación","Validación de la remediación (rescanning)","Priorización","Aceptación del riesgo"],"correcta":1,"explicacion":"Re-escanear tras remediar valida que la corrección funcionó. La identificación descubre vulnerabilidades; la priorización ordena; la aceptación decide no corregir."},{"id":"D4-016","dominio":4,"objetivo":"4.3","enunciado":"Una empresa invita a investigadores externos a encontrar fallos en su aplicación y paga una recompensa por cada vulnerabilidad válida. ¿Qué es?","opciones":["Auditoría interna","Ejercicio de mesa","Programa de recompensas por errores (bug bounty)","Honeypot"],"correcta":2,"explicacion":"Pagar a investigadores externos por fallos válidos es un bug bounty. Una auditoría interna la hace la propia empresa; un tabletop es una discusión de escenarios; un honeypot es un señuelo."},{"id":"D4-017","dominio":4,"objetivo":"4.3","enunciado":"Un sistema heredado tiene una vulnerabilidad crítica sin parche disponible. La dirección decide restringir su acceso a una VLAN aislada y documentar una excepción temporal. ¿Qué respuesta es?","opciones":["Transferencia del riesgo mediante un seguro","Re-escaneo para validar el parche","Falso negativo","Control compensatorio con excepción documentada"],"correcta":3,"explicacion":"Ante la imposibilidad de parchear se aplica un control compensatorio (aislamiento) y se documenta una excepción. No se contrata un seguro, no hay parche que validar y no es un error de detección."},{"id":"D4-018","dominio":4,"objetivo":"4.3","enunciado":"Un equipo de seguridad se suscribe a un centro sectorial donde bancos comparten indicadores de amenazas. ¿Qué fuente de inteligencia usa?","opciones":["Escáner de vulnerabilidades local","CVSS","Bug bounty","ISAC (Information Sharing and Analysis Center)"],"correcta":3,"explicacion":"Los ISAC son centros sectoriales de intercambio de inteligencia. Un escáner local no aporta inteligencia externa compartida; CVSS es una puntuación; el bug bounty busca fallos en tus sistemas."},{"id":"D4-019","dominio":4,"objetivo":"4.3","enunciado":"Un escáner no detecta una vulnerabilidad que realmente existe en el servidor y que después es explotada. ¿Qué tipo de resultado fue?","opciones":["Falso positivo (false positive)","Verdadero positivo","Falso negativo (false negative)","Excepción"],"correcta":2,"explicacion":"No detectar una vulnerabilidad real es un falso negativo, el más peligroso. Un falso positivo es una alerta errónea; un verdadero positivo sería detectarla; una excepción es una decisión de no remediar."},{"id":"D4-020","dominio":4,"objetivo":"4.4","enunciado":"Una empresa quiere centralizar los logs de firewalls, servidores y EDR, correlacionarlos y generar alertas cuando se combinen eventos sospechosos. ¿Qué herramienta necesita?","opciones":["DLP","NetFlow","SCAP","SIEM"],"correcta":3,"explicacion":"El SIEM agrega, correlaciona y alerta sobre eventos de múltiples fuentes. DLP evita fugas de datos; NetFlow registra flujos de red; SCAP automatiza evaluaciones de configuración."},{"id":"D4-021","dominio":4,"objetivo":"4.4","enunciado":"El SOC recibe cientos de alertas diarias de una regla que casi siempre resulta ser tráfico legítimo de un escáner interno. ¿Qué debe hacer?","opciones":["Desactivar el SIEM","Ignorar todas las alertas de ese día","Aumentar el número de alertas","Ajustar la regla (alert tuning) para excluir ese tráfico conocido"],"correcta":3,"explicacion":"El ajuste de alertas reduce falsos positivos y la fatiga de alertas. Desactivar el SIEM o ignorar alertas deja la organización ciega; aumentar alertas empeora el problema."},{"id":"D4-022","dominio":4,"objetivo":"4.4","enunciado":"Un administrador necesita saber qué hosts internos se comunicar
